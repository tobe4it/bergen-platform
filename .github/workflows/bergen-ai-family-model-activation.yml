name: Bergen AI approved private family chat model staging

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/manage_family_chat_profiles_v0102.py'
      - 'ansible/files/bergen_ai/prompts/learning_companion_de_v1.md'
      - 'ansible/playbooks/manage-bergen-ai-family-chat-profiles.yml'
      - 'tests/test_bergen_ai_family_chat_activation.py'
      - 'docs/BERGEN-AI-FAMILY-MODEL-ACTIVATION.md'
      - '.github/workflows/bergen-ai-family-model-activation.yml'

jobs:
  staged-private-models:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ansible lint dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Run staging and rollback policy regression tests
        run: python -m unittest discover -s tests -p 'test_bergen_ai_family_chat_activation.py' -v
      - name: Validate target playbook syntax
        run: ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-bergen-ai-family-chat-profiles.yml --syntax-check
