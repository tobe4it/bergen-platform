name: Bergen AI static family group inventory

on:
  pull_request:
    paths:
      - 'ansible/filter_plugins/bergen_ai_family_group_inventory.py'
      - 'ansible/playbooks/audit-bergen-ai-static-family-groups.yml'
      - 'tests/test_bergen_ai_family_group_inventory.py'
      - '.github/workflows/bergen-ai-family-groups.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/filter_plugins/bergen_ai_family_group_inventory.py'
      - 'ansible/playbooks/audit-bergen-ai-static-family-groups.yml'
      - 'tests/test_bergen_ai_family_group_inventory.py'
      - '.github/workflows/bergen-ai-family-groups.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline requirements
        run: python -m pip install ansible-core pyyaml
      - name: Check group privacy and fail-closed audit contracts
        run: python -m unittest discover -s tests -p 'test_bergen_ai_family_group_inventory.py' -v
      - name: Check Ansible syntax
        run: ansible-playbook -i localhost, --syntax-check ansible/playbooks/audit-bergen-ai-static-family-groups.yml
