name: Bergen-AI token-free family SQLite audit

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/audit_sqlite_family_groups.py'
      - 'ansible/playbooks/audit-bergen-ai-family-sqlite-readonly.yml'
      - 'tests/test_bergen_ai_family_sqlite_audit.py'
      - 'docs/BERGEN-AI-FAMILY-SQLITE-AUDIT.md'
      - '.github/workflows/bergen-ai-family-sqlite-audit.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/files/bergen_ai/audit_sqlite_family_groups.py'
      - 'ansible/playbooks/audit-bergen-ai-family-sqlite-readonly.yml'
      - 'tests/test_bergen_ai_family_sqlite_audit.py'

jobs:
  safety-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Synthetic SQLite and read-only contract tests
        run: python -m unittest discover -s tests -p 'test_bergen_ai_family_sqlite_audit.py' -v
      - name: Offline syntax validation
        run: ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-bergen-ai-family-sqlite-readonly.yml --syntax-check
