name: Paperless Proxmox VZDump IaC regression
on:
  pull_request:
    paths:
      - 'ansible/roles/proxmox_vzdump_backup/**'
      - 'ansible/playbooks/configure-paperless-backup.yml'
      - 'tests/test_proxmox_vzdump_backup.py'
      - 'docs/examples/paperless-backup.local.yml.example'
      - '.github/workflows/paperless-vzdump-iac.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/roles/proxmox_vzdump_backup/**'
      - 'ansible/playbooks/configure-paperless-backup.yml'
      - 'tests/test_proxmox_vzdump_backup.py'
      - '.github/workflows/paperless-vzdump-iac.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline validation dependencies
        run: python -m pip install pyyaml jinja2 ansible-core
      - name: Run Proxmox backup safety tests
        run: python -m unittest discover -s tests -p 'test_proxmox_vzdump_backup.py'
      - name: Check Ansible playbook parses without executing
        run: ansible-playbook -i localhost, --syntax-check ansible/playbooks/configure-paperless-backup.yml
