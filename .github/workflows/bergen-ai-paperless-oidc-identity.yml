name: Bergen-AI Paperless OIDC identity boundary

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/audit_oidc_identity_binding_v0102.py'
      - 'ansible/files/paperless/audit_oidc_identity_binding.py'
      - 'ansible/files/bergen_ai/compare_oidc_subject_fingerprints.py'
      - 'ansible/playbooks/audit-bergen-ai-paperless-oidc-identity-readonly.yml'
      - 'tests/test_bergen_ai_paperless_oidc_identity.py'
      - 'docs/BERGEN-AI-PAPERLESS-OIDC-IDENTITY-BOUNDARY.md'
      - '.github/workflows/bergen-ai-paperless-oidc-identity.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/files/bergen_ai/audit_oidc_identity_binding_v0102.py'
      - 'ansible/files/paperless/audit_oidc_identity_binding.py'
      - 'ansible/files/bergen_ai/compare_oidc_subject_fingerprints.py'
      - 'ansible/playbooks/audit-bergen-ai-paperless-oidc-identity-readonly.yml'
      - 'tests/test_bergen_ai_paperless_oidc_identity.py'

jobs:
  read-only-identity-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated validation dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Run synthetic private OIDC identity-link tests
        run: python -m unittest discover -s tests -p 'test_bergen_ai_paperless_oidc_identity.py' -v
      - name: Validate controller playbook syntax
        run: ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-bergen-ai-paperless-oidc-identity-readonly.yml --syntax-check
