name: Paperless native AI inbox catalog policy

on:
  pull_request:
    paths:
      - 'ansible/files/paperless/bergen_ai_catalog_*.py'
      - 'ansible/playbooks/manage-paperless-ai-inbox-catalog.yml'
      - 'ansible/playbooks/deploy-paperless-ai-inbox-catalog-timer.yml'
      - 'ansible/files/paperless/bergen-ai-catalog-*'
      - 'tests/test_paperless_ai_catalog_policy.py'
      - 'docs/PAPERLESS-AI-INBOX-CATALOG.md'
      - 'docs/examples/paperless-ai-catalog.local.yml.example'
      - '.github/workflows/paperless-ai-inbox-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/files/paperless/bergen_ai_catalog_*.py'
      - 'ansible/playbooks/manage-paperless-ai-inbox-catalog.yml'
      - 'ansible/playbooks/deploy-paperless-ai-inbox-catalog-timer.yml'
      - 'ansible/files/paperless/bergen-ai-catalog-*'
      - 'tests/test_paperless_ai_catalog_policy.py'

jobs:
  policy-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Run explicit fail-closed policy tests
        run: python -m unittest discover -s tests -p 'test_paperless_ai_catalog_policy.py' -v
      - name: Validate read-only/pilot and separately gated automatic timer syntax
        run: |
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-paperless-ai-inbox-catalog.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/deploy-paperless-ai-inbox-catalog-timer.yml --syntax-check
