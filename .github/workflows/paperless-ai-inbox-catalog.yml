jobs:
  policy-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Run explicit fail-closed policy tests
        run: python -m unittest discover -s tests -p 'test_paperless_ai_catalog_policy.py' -v
      - name: Test bounded read-only pilot diagnosis and opt-in ID listing
        run: python -m unittest discover -s tests -p 'test_paperless_ai_pilot_candidates_readonly.py' -v
      - name: Test no-write journal diagnostic and snapshot comparison
        run: python -m unittest discover -s tests -p 'test_paperless_ai_catalog_review_readonly.py' -v
      - name: Test bounded read-only journal inventory and exact ID scope
        run: python -m unittest discover -s tests -p 'test_paperless_ai_catalog_journal_inventory_readonly.py' -v
      - name: Test post-edit taxonomy ACL audit in read-only mode
        run: python -m unittest discover -s tests -p 'test_paperless_ai_catalog_taxonomy_visibility_readonly.py' -v
      - name: Test 4-step ML -> BAI -> optional native UI gates
        run: python -m unittest discover -s tests -p 'test_paperless_ai_failure_notes_and_native_ui.py' -v
      - name: Test immutable post-watermark timer journal audit
        run: python -m unittest discover -s tests -p 'test_paperless_ai_timer_journal_readonly.py' -v
      - name: Test all-owner October Inbox cutover and immutable journal constraints
        run: python -m unittest discover -s tests -p 'test_paperless_ai_all_inbox_oct2026_v2.py' -v
      - name: Test all-owner October cutoff and safe timer upgrade
        run: python -m unittest discover -s tests -p 'test_paperless_ai_v2_all_inbox_since_october.py' -v
      - name: Validate read-only/pilot and separately gated automatic timer syntax
        run: |
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-paperless-ai-inbox-catalog.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-pilot-selection-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-catalog-review-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-catalog-journal-inventory-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-taxonomy-visibility-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-timer-journal-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/upgrade-paperless-ai-all-inbox-since-20261001.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-all-inbox-oct2026-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/upgrade-paperless-ai-inbox-catalog-all-inbox-oct2026.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-paperless-ai-native-notes.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-paperless-native-ai-suggestions-ui.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-paperless-ai-local-ollama.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-catalog-runtime-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-ollama-private-path-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-ollama-firewall-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-ollama-runtime-filter-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-ollama-negative-client-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-ollama-topology-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-ai-ollama-observed-source.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/deploy-paperless-ai-inbox-catalog-timer.yml --syntax-check
