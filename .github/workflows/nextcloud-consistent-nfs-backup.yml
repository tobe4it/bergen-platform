name: Nextcloud consistent NFS backup

on:
  pull_request:
    paths:
      - 'ansible/playbooks/deploy-nextcloud-consistent-backup.yml'
      - 'ansible/templates/nextcloud-backup/**'
      - 'ansible/vars/nextcloud-backup.local.yml.example'
      - 'docs/NEXTCLOUD-CONSISTENT-NFS-BACKUP.md'
      - '.github/workflows/nextcloud-consistent-nfs-backup.yml'
  push:
    branches:
      - feat/nextcloud-consistent-nfs-backup-20261018
    paths:
      - 'ansible/playbooks/deploy-nextcloud-consistent-backup.yml'
      - 'ansible/templates/nextcloud-backup/**'
      - '.github/workflows/nextcloud-consistent-nfs-backup.yml'

jobs:
  syntax-and-boundaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible syntax checker
        run: python3 -m pip install 'ansible-core>=2.16,<2.21'
      - name: Check backup runner source syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          p = Path("ansible/templates/nextcloud-backup/bergen-nextcloud-backup.py.j2")
          source = p.read_text()
          ast.parse(source)
          assert "maintenance:mode" in source
          assert "NEXTCLOUD_BACKUP_SUCCESS=YES" in source
          assert "REMOTE_SHA256_MISMATCH" in source
          assert "WRONG_NFS_EXPORT" in source
          assert "NFS_DIRECTORY_PERMISSIONS_UNSAFE" in source
          print("BACKUP_RUNNER_STATIC_CHECK=OK")
          PY
      - name: Check playbook syntax
        run: |
          ansible-playbook \
            -i localhost, \
            ansible/playbooks/deploy-nextcloud-consistent-backup.yml \
            --syntax-check
      - name: Guard against unreviewed mail backup modification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("ansible/playbooks/deploy-nextcloud-consistent-backup.yml").read_text()
          assert "/usr/local/bin/backup.sh" not in source
          assert "04:30:00" in source
          assert "backup_first_verification" in source
          print("BACKUP_DEPLOY_BOUNDARIES=OK")
          PY
