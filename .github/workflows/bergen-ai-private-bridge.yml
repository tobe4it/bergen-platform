      - 'tests/test_bergen_ai_ct110_backup_policy_readonly.py'
      - 'tests/test_bergen_ai_ct110_oneoff_backup.py'
      - 'tests/test_bergen_ai_ct110_mount_directives_readonly.py'
      - 'tests/test_bergen_ai_ct110_persistent_data_readonly.py'
      - 'tests/test_bergen_ai_ct110_guest_mount_blockers_readonly.py'
      - 'tests/test_bergen_ai_ct110_runtime_mount_relationships_readonly.py'
      - 'tests/test_bergen_ai_ct110_postbackup_archive_readonly.py'
      - 'docs/examples/bergen-ai-bridge-ipam.local.json.example'

jobs:
  readonly-policy-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline testing dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Test no-mutation and CIDR guard invariants
        run: |
          python -m unittest discover -s tests -p 'test_bergen_ai_private_bridge_preflight.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_private_bridge_external_gates.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_private_bridge_backup_inventory.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_backup_policy_readonly.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_oneoff_backup.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_mount_directives_readonly.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_persistent_data_readonly.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_guest_mount_blockers_readonly.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_runtime_mount_relationships_readonly.py' -v
          python -m unittest discover -s tests -p 'test_bergen_ai_ct110_postbackup_archive_readonly.py' -v
      - name: Validate read-only Proxmox inventory playbook syntax
        run: |
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-private-bridge-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-private-bridge-extended-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-private-bridge-external-gates-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-private-bridge-backups-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-ct110-backup-policy-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/preflight-bergen-ai-ct110-oneoff-backup-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/backup-bergen-ai-ct110-once.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-ct110-mount-directives-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-ct110-persistent-data-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-ct110-guest-mount-blockers-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-ct110-runtime-mount-relationships-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-ct110-postbackup-archive-readonly.yml --syntax-check
