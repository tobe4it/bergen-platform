name: Bergen-AI private Proxmox bridge preflight

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/audit_private_bridge_preflight.py'
      - 'ansible/playbooks/audit-bergen-ai-private-bridge-readonly.yml'
      - 'docs/BERGEN-AI-PRIVATE-PROXMOX-BRIDGE.md'
      - 'tests/test_bergen_ai_private_bridge_preflight.py'
      - '.github/workflows/bergen-ai-private-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/files/bergen_ai/audit_private_bridge_preflight.py'
      - 'ansible/playbooks/audit-bergen-ai-private-bridge-readonly.yml'
      - 'tests/test_bergen_ai_private_bridge_preflight.py'

jobs:
  readonly-policy-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline testing dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Test no-mutation and CIDR guard invariants
        run: python -m unittest discover -s tests -p 'test_bergen_ai_private_bridge_preflight.py' -v
      - name: Validate read-only Proxmox inventory playbook syntax
        run: |
          ansible-playbook -i ansible/inventory.yml \
            ansible/playbooks/audit-bergen-ai-private-bridge-readonly.yml --syntax-check
