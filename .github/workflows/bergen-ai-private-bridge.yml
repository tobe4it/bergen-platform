    paths:
      - 'ansible/files/bergen_ai/audit_private_bridge_preflight.py'
      - 'ansible/files/bergen_ai/audit_private_bridge_extended_networks.py'
      - 'ansible/files/bergen_ai/audit_private_bridge_external_gates.py'
      - 'ansible/files/bergen_ai/audit_private_bridge_backup_inventory.py'
      - 'ansible/files/bergen_ai/audit_ct110_backup_policy_readonly.py'
