name: Isolated Nextcloud restore 701 preflight

on:
  pull_request:
    paths:
      - 'ansible/playbooks/prepare-nextcloud-isolated-restore-701.yml'
      - 'ansible/playbooks/audit-nextcloud-restore-transfer-readonly.yml'
      - 'ansible/playbooks/transfer-nextcloud-restore-archive.yml'
      - 'ansible/files/nextcloud/stream_verified_restore_archive.py'
      - 'ansible/files/nextcloud/audit_verified_restore_archive.py'
      - 'ansible/files/nextcloud/diagnose_restore_archive_member_types.py'
      - 'ansible/playbooks/diagnose-nextcloud-restore-archive-types-readonly.yml'
      - 'tests/test_nextcloud_restore_archive_type_diagnostic.py'
      - 'tests/test_nextcloud_restore_archive_symlink_audit.py'
      - 'ansible/playbooks/audit-nextcloud-restore-archive-readonly.yml'
      - 'ansible/playbooks/inspect-nextcloud-restore-701-offline-runtime.yml'
      - 'docs/NEXTCLOUD-ISOLATED-RESTORE-701.md'
      - '.github/workflows/nextcloud-isolated-restore-701.yml'
  push:
    branches: [feat/nextcloud-isolated-restore-701-20261019]

jobs:
  offline-guest-boundaries:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: python3 -m pip install 'ansible-core>=2.16,<2.21'
      - name: Syntax
        run: |
          ansible-playbook -i localhost, \
            ansible/playbooks/prepare-nextcloud-isolated-restore-701.yml \
            --syntax-check
          ansible-playbook -i localhost, \
            ansible/playbooks/audit-nextcloud-restore-transfer-readonly.yml \
            --syntax-check
          ansible-playbook -i localhost, \
            ansible/playbooks/transfer-nextcloud-restore-archive.yml \
            --syntax-check
          python3 -m py_compile ansible/files/nextcloud/stream_verified_restore_archive.py
          python3 -m py_compile ansible/files/nextcloud/audit_verified_restore_archive.py
          python3 -m py_compile ansible/files/nextcloud/diagnose_restore_archive_member_types.py
          ansible-playbook -i localhost, \
            ansible/playbooks/diagnose-nextcloud-restore-archive-types-readonly.yml \
            --syntax-check
          python3 -m unittest discover -s tests -p 'test_nextcloud_restore_archive_type_diagnostic.py'
          python3 -m unittest discover -s tests -p 'test_nextcloud_restore_archive_symlink_audit.py'
          ansible-playbook -i localhost, \
            ansible/playbooks/audit-nextcloud-restore-archive-readonly.yml \
            --syntax-check
          ansible-playbook -i localhost, \
            ansible/playbooks/inspect-nextcloud-restore-701-offline-runtime.yml \
            --syntax-check
      - name: Verify offline-only initial provisioning
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          source = Path("ansible/playbooks/prepare-nextcloud-isolated-restore-701.yml").read_text()
          plays = yaml.safe_load(source)
          assert len(plays) == 1
          assert plays[0]["hosts"] == "venombox"
          tasks = plays[0]["tasks"]
          create = [t for t in tasks if t.get("name", "").startswith("Create expressly approved")]
          assert len(create) == 1
          argv = create[0]["ansible.builtin.command"]["argv"]
          assert argv[:2] == ["pct", "create"]
          assert "--net0" not in argv and "--net1" not in argv
          for key, expected in [
              ("--unprivileged", "1"), ("--onboot", "0"),
              ("--start", "0"), ("--protection", "1"),
          ]:
              assert argv[argv.index(key)+1] == expected
          assert "nextcloud_restore_701_apply" in create[0]["when"]
          forbidden = {
              "ansible.builtin.shell", "ansible.builtin.script",
              "ansible.builtin.raw", "ansible.builtin.template",
              "ansible.builtin.systemd", "ansible.builtin.service",
          }
          assert not any(any(k in forbidden for k in t) for t in tasks)
          transfer = Path("ansible/files/nextcloud/stream_verified_restore_archive.py").read_text()
          assert 'StrictHostKeyChecking=yes' in transfer
          assert 'ForwardAgent=no' in transfer
          assert 'O_NOFOLLOW' in transfer
          assert 'sha256' in transfer
          assert '/var/lib/vz/nextcloud-restore-test' in transfer
          assert '20261019T' not in transfer
          assert '--apply' in transfer
          assert 'TARGET_ARCHIVE_SHA256_VERIFIED=YES' in transfer
          assert 'NEXTCLOUD_RESTORE_ARCHIVE_ALREADY_VERIFIED=YES' in transfer
          assert 'NEXTCLOUD_RESTORE_ARCHIVE_RECEIPT_RECOVERED=YES' in transfer
          archive = Path("ansible/files/nextcloud/audit_verified_restore_archive.py").read_text()
          assert 'PINNED_SHA256_MISMATCH' in archive
          assert 'UNSAFE_ARCHIVE_SEGMENT' in archive
          assert 'DUPLICATE_ARCHIVE_MEMBER' in archive
          assert 'SQL_DATABASE_NOT_CONFIRMED' in archive
          assert 'tarfile.open(archive, "r:gz")' in archive
          assert 'validate_symbolic_links(seen, links)' in archive
          assert 'SYMLINK_CHAIN_DEPTH_EXCEEDED' in archive
          assert 'SYMLINK_ESCAPE' in archive
          assert 'DANGLING_SYMLINK_TARGET' in archive
          diag = Path("ansible/files/nextcloud/diagnose_restore_archive_member_types.py").read_text()
          assert 'DIAGNOSTIC_FAILED=' in diag
          assert 'tarfile.open(archive, "r:gz")' in diag
          assert 'NEXTCLOUD_ARCHIVE_TYPE_DIAGNOSTIC=COMPLETE' in diag
          assert 'archive_extracted": False' in diag

          boot = yaml.safe_load(Path("ansible/playbooks/inspect-nextcloud-restore-701-offline-runtime.yml").read_text())
          assert len(boot) == 1 and boot[0]["hosts"] == "venombox"
          tasks_boot = boot[0]["tasks"]
          start_tasks = [t for t in tasks_boot if t.get("name", "").startswith("Start only explicitly approved")]
          assert len(start_tasks) == 1
          assert start_tasks[0]["ansible.builtin.command"]["argv"] == ["pct","start","701"]
          assert "nextcloud_restore_701_start" in start_tasks[0]["when"]
          assert not any(any(key in t for key in ("ansible.builtin.shell", "ansible.builtin.template", "ansible.builtin.file", "ansible.builtin.copy")) for t in tasks_boot)
          assert "NON_LOOPBACK_DEVICES=0" in Path("ansible/playbooks/inspect-nextcloud-restore-701-offline-runtime.yml").read_text()
          print("NEXTCLOUD_701_OFFLINE_STATIC_BOUNDARIES=PASS")
          PY
