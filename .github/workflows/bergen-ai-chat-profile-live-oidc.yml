name: Bergen AI family profiles on live OIDC

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/audit_family_chat_ready_v0102.py'
      - 'ansible/files/bergen_ai/manage_family_chat_profiles_v0102.py'
      - 'ansible/playbooks/audit-bergen-ai-family-chat-readiness-readonly.yml'
      - 'ansible/playbooks/manage-bergen-ai-family-chat-profiles.yml'
      - 'ansible/files/bergen_ai/prompts/learning_companion_de_v1.md'
      - 'tests/test_bergen_ai_chat_profile_live_oidc.py'
      - 'docs/BERGEN-AI-CHAT-PROFILES-LIVE-OIDC.md'
      - '.github/workflows/bergen-ai-chat-profile-live-oidc.yml'

jobs:
  guarded-model-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification tools
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Synthetic OIDC membership / model / prompt regression tests
        run: python -m unittest discover -s tests -p 'test_bergen_ai_chat_profile_live_oidc.py' -v
      - name: Syntax and offline Python parser checks
        run: |
          python -m py_compile ansible/files/bergen_ai/audit_family_chat_ready_v0102.py ansible/files/bergen_ai/manage_family_chat_profiles_v0102.py
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-bergen-ai-family-chat-readiness-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-bergen-ai-family-chat-profiles.yml --syntax-check
