name: Bergen AI family model ACL read-only audit

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/audit_family_model_access_v0102.py'
      - 'ansible/playbooks/audit-bergen-ai-family-model-access-readonly.yml'
      - 'tests/test_bergen_ai_family_model_access_readonly.py'
      - 'docs/BERGEN-AI-FAMILY-MODEL-ACCESS.md'
      - '.github/workflows/bergen-ai-family-model-access.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/files/bergen_ai/audit_family_model_access_v0102.py'
      - 'ansible/playbooks/audit-bergen-ai-family-model-access-readonly.yml'
      - 'tests/test_bergen_ai_family_model_access_readonly.py'

jobs:
  audit-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install narrow Ansible validation dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Parent and child model isolation regression
        run: python -m unittest discover -s tests -p 'test_bergen_ai_family_model_access_readonly.py' -v
      - name: Model audit syntax check
        run: ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-bergen-ai-family-model-access-readonly.yml --syntax-check
