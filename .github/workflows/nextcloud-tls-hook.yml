name: Nextcloud TLS hook verification

on:
  pull_request:
    paths:
      - 'ansible/playbooks/mail-source-nextcloud-tls-hook.yml'
      - 'ansible/vars/mail-cloud-tls.local.yml.example'
      - 'tests/test_mail_source_nextcloud_tls_hook.py'
      - '.github/workflows/nextcloud-tls-hook.yml'
  push:
    branches: [main]
    paths:
      - 'ansible/playbooks/mail-source-nextcloud-tls-hook.yml'
      - 'ansible/vars/mail-cloud-tls.local.yml.example'
      - 'tests/test_mail_source_nextcloud_tls_hook.py'
      - '.github/workflows/nextcloud-tls-hook.yml'

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install pytest pyyaml ansible-core
      - name: Test scoped and fail-closed deploy hook
        run: python -m pytest -q tests/test_mail_source_nextcloud_tls_hook.py
      - name: Validate Ansible playbook syntax
        run: ansible-playbook -i localhost, --syntax-check ansible/playbooks/mail-source-nextcloud-tls-hook.yml
