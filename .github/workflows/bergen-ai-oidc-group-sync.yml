name: Bergen AI OIDC groups guarded activation

on:
  pull_request:
    paths:
      - 'ansible/files/bergen_ai/manage_oidc_group_sync_v0102.py'
      - 'ansible/playbooks/manage-bergen-ai-oidc-group-sync.yml'
      - 'tests/test_bergen_ai_oidc_group_sync.py'
      - 'docs/BERGEN-AI-OIDC-GROUP-SYNC-ACTIVATION.md'
      - '.github/workflows/bergen-ai-oidc-group-sync.yml'

jobs:
  protected-oidc-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: Run tested config and membership-isolation policies
        run: python -m unittest discover -s tests -p 'test_bergen_ai_oidc_group_sync.py' -v
      - name: Validate production playbook syntax
        run: ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-bergen-ai-oidc-group-sync.yml --syntax-check
