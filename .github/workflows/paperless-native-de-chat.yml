name: Paperless native German AI and chat

on:
  pull_request:
    paths:
      - 'ansible/files/paperless/bergen_ai_native_de_chat_config.py'
      - 'ansible/files/paperless/bergen_ai_catalog_runner.py'
      - 'ansible/playbooks/manage-paperless-native-de-chat.yml'
      - 'ansible/playbooks/audit-paperless-native-chat-access-and-index-readonly.yml'
      - 'ansible/files/paperless/audit_native_de_chat_index.py'
      - 'ansible/files/paperless/audit_native_chat_ownerless_acl.py'
      - 'ansible/files/paperless/audit_native_chat_verified_group_imports.py'
      - 'ansible/files/paperless/audit_native_chat_child_boundary.py'
      - 'ansible/playbooks/audit-paperless-native-chat-child-boundary-readonly.yml'
      - 'tests/test_paperless_native_de_chat.py'
      - '.github/workflows/paperless-native-de-chat.yml'
      - 'docs/PAPERLESS-NATIVE-DE-CHAT.md'
  push:
    branches: [main]
    paths:
      - 'ansible/files/paperless/bergen_ai_native_de_chat_config.py'
      - 'ansible/files/paperless/bergen_ai_catalog_runner.py'
      - 'ansible/playbooks/manage-paperless-native-de-chat.yml'
      - 'ansible/playbooks/audit-paperless-native-chat-access-and-index-readonly.yml'
      - 'ansible/files/paperless/audit_native_de_chat_index.py'
      - 'ansible/files/paperless/audit_native_chat_ownerless_acl.py'
      - 'ansible/files/paperless/audit_native_chat_verified_group_imports.py'
      - 'ansible/files/paperless/audit_native_chat_child_boundary.py'
      - 'ansible/playbooks/audit-paperless-native-chat-child-boundary-readonly.yml'
      - 'tests/test_paperless_native_de_chat.py'
      - '.github/workflows/paperless-native-de-chat.yml'

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install syntax and YAML tooling
        run: python -m pip install 'ansible-core>=2.16,<2.18' 'PyYAML>=6,<7'
      - name: German worker/local chat security regression
        run: python -m unittest discover -s tests -p 'test_paperless_native_de_chat.py' -v
      - name: Preserve all-Inbox processing safety regression
        run: python -m unittest discover -s tests -p 'test_paperless_ai_v2_all_inbox_since_october.py' -v
      - name: Check native AI and effective chat permission audits syntax
        run: |
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/manage-paperless-native-de-chat.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-native-chat-access-and-index-readonly.yml --syntax-check
          ansible-playbook -i ansible/inventory.yml ansible/playbooks/audit-paperless-native-chat-child-boundary-readonly.yml --syntax-check
