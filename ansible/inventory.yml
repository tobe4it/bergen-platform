---
all:
  children:

    controllers:
      hosts:
        ansible-old:
          ansible_connection: local

        bp-controller:
          # Resolve via DNS; site-specific addresses belong in inventory.local.yml.
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3

    proxmox_hosts:
      hosts:
        venombox:
          # Resolve via DNS; site-specific addresses belong in inventory.local.yml.
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3

        bergen-ai:
          # DHCP guest: resolve the inventory hostname via DNS or override
          # ansible_host in inventory.local.yml. Never pin a leased address.
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3

    ai_nodes:
      hosts:
        bergen-ai:

    mqtt_nodes:
      hosts: {}

    mail_backend_nodes:
      hosts: {}

    evcc_nodes:
      hosts: {}

    evcc_legacy_nodes:
      hosts: {}

    linux_lxcs:
      hosts:
        bp-controller:
        bergen-ai:
