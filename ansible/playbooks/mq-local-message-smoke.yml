---
- name: Validate client login and prepare probe
  ansible.builtin.import_playbook: mq-client-auth-smoke.yml

- name: Test local messaging with an isolated temporary queue
  hosts: bergen-mq-client
  gather_facts: false
  become: true
  vars:
    mq_smoke_side: a
    mq_smoke_targets:
      a: {server: bergen-mq-lab, qmgr: BERGENLAB, username: bgtaudita, group: MQBERGENLAB}
      b: {server: bergen-mq-lab-b, qmgr: BERGENLABB, username: bgtauditb, group: MQBERGENLABB}
    mq_smoke_target: "{{ mq_smoke_targets[mq_smoke_side] }}"
    mq_smoke_password: "{{ lookup('vars', 'vault_mq_test_' ~ mq_smoke_side ~ '_password') }}"
    mq_smoke_server: "{{ mq_smoke_target.server }}"
    mq_smoke_peer: "CN={{ mq_smoke_target.server }}"
    mq_message_argv:
      - env
      - CONTAINERS_STORAGE_CONF=/etc/bergen-mq-lab/storage.conf
      - podman
      - exec
      - -i
      - bergen-mq-lab
      - /opt/mqm/bin/runmqsc
      - "{{ mq_smoke_target.qmgr }}"
  tasks:
    - name: Generate a unique queue name for this execution
      ansible.builtin.set_fact:
        mq_message_queue: "BGT.LOCAL.{{ lookup('password', '/dev/null', length=24, chars=['ascii_uppercase', 'digits']) }}"
        mq_message_created: false

    - name: Show exact temporary object for troubleshooting
      ansible.builtin.debug:
        msg: "{{ mq_smoke_target.qmgr }}: {{ mq_message_queue }}"

    - name: Test with guarded cleanup
      block:
        - name: Create only a new isolated persistent test queue
          ansible.builtin.command:
            argv: "{{ mq_message_argv }}"
            stdin: "DEFINE QLOCAL('{{ mq_message_queue }}') DEFPSIST(YES) MAXDEPTH(10) MAXMSGL(1048576) MSGDLVSQ(FIFO) DESCR('Bergen temporary local messaging test')"
          delegate_to: "{{ mq_smoke_server }}"
          register: mq_message_create
          changed_when: mq_message_create.rc == 0

        - name: Record ownership after successful creation
          ansible.builtin.set_fact:
            mq_message_created: true

        - name: Grant exact queue rights to the selected LDAP group
          ansible.builtin.command:
            argv: "{{ mq_message_argv }}"
            stdin: "SET AUTHREC PROFILE('{{ mq_message_queue }}') OBJTYPE(QUEUE) GROUP('{{ mq_smoke_target.group }}') AUTHADD(PUT,GET,BROWSE,INQ)"
          delegate_to: "{{ mq_smoke_server }}"
          changed_when: true

        - name: Run persistent message and transaction cases
          ansible.builtin.include_tasks: tasks/mq-client-auth-smoke-case.yml
          loop:
            - {name: payload_and_message_id, operation: roundtrip, ok: true, reason: 0}
            - {name: put_commit_visibility, operation: put_commit, ok: true, reason: 0}
            - {name: put_rollback, operation: put_rollback, ok: true, reason: 0}
            - {name: disconnect_rollback, operation: disconnect_rollback, ok: true, reason: 0}
            - {name: get_commit, operation: get_commit, ok: true, reason: 0}
            - {name: get_rollback_backout_count, operation: get_rollback, ok: true, reason: 0}
            - {name: browse_without_consumption, operation: browse, ok: true, reason: 0}
            - {name: correlation_id, operation: correlation, ok: true, reason: 0}
            - {name: fifo_order, operation: fifo, ok: true, reason: 0}
            - {name: message_expiry, operation: expiry, ok: true, reason: 0}
          loop_control:
            loop_var: smoke_case
            label: "{{ smoke_case.name }}"
      always:
        - name: Remove only this run's empty queue and its exact authority records
          ansible.builtin.command:
            argv: "{{ mq_message_argv }}"
            stdin: "DELETE QLOCAL('{{ mq_message_queue }}') NOPURGE AUTHREC(YES)"
          delegate_to: "{{ mq_smoke_server }}"
          when: mq_message_created | bool
          register: mq_message_cleanup
          changed_when: mq_message_cleanup.rc == 0

    - name: Verify the exact queue is absent after cleanup
      ansible.builtin.command:
        argv: "{{ mq_message_argv }}"
        stdin: "DISPLAY QLOCAL('{{ mq_message_queue }}')"
      delegate_to: "{{ mq_smoke_server }}"
      register: mq_message_absent
      changed_when: false
      failed_when: mq_message_absent.rc != 10 or 'AMQ8147E' not in mq_message_absent.stdout

    - name: Report local messaging scope
      ansible.builtin.debug:
        msg: "PASS: {{ mq_smoke_target.qmgr }} ten local message cases and empty-queue cleanup. No two-QMgr routing, restart durability, mTLS, downgrade or PQC claim."
