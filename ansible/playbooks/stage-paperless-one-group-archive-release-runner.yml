---
# Stage root-owned archive code on NAS, NEVER create activation gate or move PDFs.
# Explicit operator action only. Use ignored site-local settings.
- name: Stage disabled Synology one-group-PDF release runner
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    group_runner_source: "{{ playbook_dir }}/../files/paperless/synology_one_group_archive_release.py"
    group_runner_name: synology_one_group_archive_release.py
  tasks:
    - name: Validate existing site-local Synology configuration
      ansible.builtin.assert:
        that:
          - synology_admin is defined
          - synology_admin is match('^[A-Za-z_][A-Za-z0-9_.-]*@[A-Za-z0-9][A-Za-z0-9.-]+$')
          - synology_config is defined
          - synology_config.schema_version == 1
          - synology_config.sync_user == 'paperless-sync'
          - synology_config.state_parent is match('^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')

    - name: Hash local reviewed runner bytes
      ansible.builtin.stat:
        path: "{{ group_runner_source }}"
        checksum_algorithm: sha256
      register: group_runner_local
      failed_when: >-
        not group_runner_local.stat.exists or
        not group_runner_local.stat.isreg or
        group_runner_local.stat.islnk

    - name: Validate root-owned code parent and disabled commit gate
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - sudo -n /bin/sh -s
        stdin: |
          set -eu
          PARENT={{ synology_config.state_parent | quote }}
          BIN="$PARENT/bin"
          TARGET="$BIN/synology_one_group_archive_release.py"
          test "$(stat -c '%u:%a' "$PARENT")" = "0:755"
          test "$(stat -c '%u:%a' "$BIN")" = "0:755"
          test ! -L "$PARENT" && test ! -L "$BIN"
          for gate in archive-move.enabled archive-move.homes.enabled archive-move.paperless-scan.enabled; do
            test ! -e "$PARENT/$gate"
            test ! -L "$PARENT/$gate"
          done
          if test -e "$TARGET" || test -L "$TARGET"; then
            test ! -L "$TARGET"
            test -f "$TARGET"
            test "$(stat -c '%u:%a' "$TARGET")" = "0:644"
          fi
          echo GROUP_ARCHIVE_RELEASE_RUNNER_STAGE_ALLOWED
      register: group_stage_guard
      changed_when: false

    - name: Require inactive archive gate before any code transfer
      ansible.builtin.assert:
        that:
          - "'GROUP_ARCHIVE_RELEASE_RUNNER_STAGE_ALLOWED' in group_stage_guard.stdout_lines"

    - name: Stage verified file with cleanup
      block:
        - name: Allocate private temporary NAS source path
          ansible.builtin.command:
            argv:
              - ssh
              - -T
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - "{{ synology_admin }}"
              - umask 077; mktemp /tmp/bergen-paperless-archive.XXXXXXXX
          register: group_temp_path
          changed_when: true

        - name: Validate temporary file location
          ansible.builtin.assert:
            that:
              - group_temp_path.stdout | trim is match('^/tmp/bergen-paperless-archive\.[A-Za-z0-9]{8}$')

        - name: Upload runner source only to isolated staging
          ansible.builtin.command:
            argv:
              - ssh
              - -T
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - "{{ synology_admin }}"
              - "umask 077; cat > {{ group_temp_path.stdout | trim | quote }}"
            stdin: "{{ lookup('ansible.builtin.file', group_runner_source, rstrip=False) }}"
            stdin_add_newline: false
          changed_when: true

        - name: Hash remote temporary runner
          ansible.builtin.command:
            argv:
              - ssh
              - -T
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - "{{ synology_admin }}"
              - "sha256sum {{ group_temp_path.stdout | trim | quote }}"
          register: remote_group_hash
          changed_when: false

        - name: Reject mismatched runner bytes
          ansible.builtin.assert:
            that:
              - remote_group_hash.stdout.split()[0] == group_runner_local.stat.checksum

        - name: Install reviewed root-owned code while commit gate remains absent
          ansible.builtin.command:
            argv:
              - ssh
              - -T
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - "{{ synology_admin }}"
              - sudo -n /bin/sh -s
            stdin: |
              set -eu
              PARENT={{ synology_config.state_parent | quote }}
              BIN="$PARENT/bin"
              SOURCE={{ group_temp_path.stdout | trim | quote }}
              TARGET="$BIN/synology_one_group_archive_release.py"
              for gate in archive-move.enabled archive-move.homes.enabled archive-move.paperless-scan.enabled; do
                test ! -e "$PARENT/$gate"
                test ! -L "$PARENT/$gate"
              done
              test "$(sha256sum "$SOURCE" | cut -d ' ' -f 1)" = {{ group_runner_local.stat.checksum | quote }}
              if test -e "$TARGET" || test -L "$TARGET"; then
                test ! -L "$TARGET"
                test "$(stat -c '%u:%a' "$TARGET")" = "0:644"
              fi
              TMP=$(mktemp "$BIN/.archive-code.XXXXXXXX")
              trap 'rm -f "$TMP"' EXIT
              install -o root -g root -m 0644 "$SOURCE" "$TMP"
              test "$(sha256sum "$TMP" | cut -d ' ' -f 1)" = {{ group_runner_local.stat.checksum | quote }}
              mv -f "$TMP" "$TARGET"
              trap - EXIT
              for gate in archive-move.enabled archive-move.homes.enabled archive-move.paperless-scan.enabled; do
                test ! -e "$PARENT/$gate"
                test ! -L "$PARENT/$gate"
              done
              echo GROUP_ARCHIVE_RELEASE_RUNNER_STAGED_DISABLED
          register: group_runner_install
          changed_when: true

        - name: Require disabled status after installation
          ansible.builtin.assert:
            that:
              - "'GROUP_ARCHIVE_RELEASE_RUNNER_STAGED_DISABLED' in group_runner_install.stdout_lines"
      always:
        - name: Clean up this playbook's isolated staging file
          ansible.builtin.command:
            argv:
              - ssh
              - -T
              - -o
              - BatchMode=yes
              - -o
              - StrictHostKeyChecking=yes
              - "{{ synology_admin }}"
              - "rm -f -- {{ group_temp_path.stdout | trim | quote }}"
          when:
            - group_temp_path is defined
            - group_temp_path.stdout is defined
            - group_temp_path.stdout | trim is match('^/tmp/bergen-paperless-archive\.[A-Za-z0-9]{8}$')
          changed_when: false

    - name: Display disabled install status
      ansible.builtin.debug:
        msg: "Staged root-owned group archive release runner; gates absent; no PDF moved"
