---
# Evaluation only. Reconcile dedicated transport objects; never start a channel.
# Preview only. Persistent transport objects must NOT be applied; per-run lifecycle pending.
- name: Reconcile dedicated TLS transport objects between BERGENLAB and BERGENLABB
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    mq_transport_sides:
      - {side: a, peer: b, sender: BGT.A2B, receiver: BGT.B2A, xmitq: BGT.XMIT.A2B}
      - {side: b, peer: a, sender: BGT.B2A, receiver: BGT.A2B, xmitq: BGT.XMIT.B2A}
  tasks:
    - name: Require explicit evaluation identities and TLS 1.3 settings
      ansible.builtin.assert:
        that:
          - mq_topology_nodes is defined
          - mq_topology_nodes.keys() | list | sort == ['a', 'b']
          - mq_topology_nodes.a.qmgr == 'BERGENLAB'
          - mq_topology_nodes.b.qmgr == 'BERGENLABB'
          - mq_topology_nodes.a.host != mq_topology_nodes.b.host
          - mq_topology_nodes.a.endpoint != mq_topology_nodes.b.endpoint
          - mq_topology_nodes.a.protocol == 'TLSv1.3'
          - mq_topology_nodes.b.protocol == 'TLSv1.3'
          - mq_topology_nodes.a.cipher == 'TLS_AES_256_GCM_SHA384'
          - mq_topology_nodes.b.cipher == 'TLS_AES_256_GCM_SHA384'
          - ansible_check_mode
        fail_msg: >-
          This prototype is preview-only. Audit transport fixtures must be
          per-run owned and cleaned up, not installed as persistent objects.

    - name: Require explicit peer network and certificate trust review for live changes
      ansible.builtin.assert:
        that:
          - ansible_check_mode
        fail_msg: >-
          Verify reciprocal source-specific TCP/1414 firewall access and that each
          queue manager trusts the OTHER queue manager's messaging CA before apply.
          These booleans are operator attestations, not automatic tests.

    - name: Preview or reconcile isolated transmission queues and TLS channel pairs
      mq_objects:
        endpoint: "{{ mq_topology_nodes[item.side].endpoint }}"
        qmgr: "{{ mq_topology_nodes[item.side].qmgr }}"
        username: "{{ mq_topology_nodes[item.side].admin_user }}"
        password: "{{ mq_topology_nodes[item.side].admin_password }}"
        ca_path: "{{ mq_topology_nodes[item.side].admin_ca }}"
        allow_deletion: false
        objects:
          - name: "{{ item.xmitq }}"
            type: qlocal
            state: present
            attributes:
              usage: xmitq
              defpsist: "yes"
              descr: "Dedicated Bergen evaluation transmission queue"
          - name: "{{ item.sender }}"
            type: channel
            state: present
            attributes:
              chltype: sdr
              conname: "{{ mq_topology_nodes[item.peer].host }}({{ mq_topology_nodes[item.peer].port | default(1414) }})"
              xmitq: "{{ item.xmitq }}"
              sslciph: TLS_AES_256_GCM_SHA384
              descr: "Dedicated Bergen TLS 1.3 sender"
          - name: "{{ item.receiver }}"
            type: channel
            state: present
            attributes:
              chltype: rcvr
              sslciph: TLS_AES_256_GCM_SHA384
              sslcauth: optional
              descr: "Dedicated Bergen TLS 1.3 receiver"
      loop: "{{ mq_transport_sides }}"
      loop_control:
        label: "{{ mq_topology_nodes[item.side].qmgr }}"
      register: mq_transport_reconciliations

    - name: Report bounded transport-object reconciliation
      ansible.builtin.debug:
        msg:
          - "Mode: {{ 'DISPLAY/check only' if ansible_check_mode else 'apply and post-DISPLAY verify' }}"
          - "A and B evaluated: {{ mq_transport_reconciliations.results | length }}"
          - "Any configuration drift: {{ mq_transport_reconciliations.results | selectattr('changed') | list | length > 0 }}"
          - "No channels were started; no firewall or certificate trust was changed."
