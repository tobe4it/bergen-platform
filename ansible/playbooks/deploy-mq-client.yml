---
# Evaluation client, deliberately separate from both queue managers.
- name: Validate isolated MQ client deployment before provisioning
  hosts: "{{ pve_inventory_host | default(pve_node) }}"
  become: true
  gather_facts: false
  tasks:
    - name: Require reviewed site inputs
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - mq_lab_confirm_test_only | default(false) | bool
          - mq_lab_license_acceptance | default('not-accepted') == 'accept'
          - lxc_unprivileged | bool
          - lxc_hostname is match('^bergen-mq-client(-[a-z0-9]+)?$')
          - lxc_inventory_group == 'mq_client_nodes'
          - lxc_vmid | int > 0
          - lxc_template is match('^[^:]+:vztmpl/rockylinux-9-.*[.]tar[.](xz|zst|gz)$')
          - remote_syslog_server is defined
          - remote_syslog_server != 'CHANGE_ME'
          - mq_client_source_host in groups.get('mq_lab_nodes', [])
          - mq_client_source_host != lxc_hostname
          - mq_client_source_image is match('^icr[.]io/ibm-messaging/mq:9[.]4[.].*-amd64@sha256:[a-f0-9]{64}$')
        fail_msg: "Fill the client site file, select an existing MQ source and review IBM evaluation terms."

    - name: Read cluster VMID assignments
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      register: mq_client_cluster
      changed_when: false

    - name: Select requested resource
      ansible.builtin.set_fact:
        mq_client_existing: "{{ mq_client_cluster.stdout | from_json | selectattr('vmid', 'equalto', lxc_vmid | int) | list }}"

    - name: Refuse an unrelated existing guest
      ansible.builtin.assert:
        that:
          - >-
            mq_client_existing | length == 0 or
            (mq_client_existing | length == 1 and
             mq_client_existing[0].type == 'lxc' and
             mq_client_existing[0].name == lxc_hostname and
             mq_client_existing[0].node == pve_node)
        fail_msg: "VMID collision; no guest will be replaced."

    - name: Resolve template archive
      ansible.builtin.command:
        argv: [pvesm, path, "{{ lxc_template }}"]
      register: mq_client_template
      changed_when: false

    - name: Inspect template archive
      ansible.builtin.stat:
        path: "{{ mq_client_template.stdout | trim }}"
      register: mq_client_template_stat

    - name: Require downloaded template
      ansible.builtin.assert:
        that: [mq_client_template_stat.stat.isreg | default(false)]

- import_playbook: prepare-mq-client-artifact.yml
- import_playbook: create-lxc.yml
- name: Start client without restarting a running guest
  hosts: "{{ pve_inventory_host | default(pve_node) }}"
  become: true
  gather_facts: false
  tasks:
    - name: Read client state
      ansible.builtin.command:
        argv: [pct, status, "{{ lxc_vmid | string }}"]
      register: mq_client_state
      changed_when: false
    - name: Start stopped client
      ansible.builtin.command:
        argv: [pct, start, "{{ lxc_vmid | string }}"]
      when: "'status: stopped' in mq_client_state.stdout"
      changed_when: true

- import_playbook: prepare-mq-lxc-ssh.yml
- import_playbook: discover-lxc.yml
- import_playbook: update-inventory.yml
- name: Configure the discovered MQ client only
  hosts: "{{ lxc_hostname }}"
  become: true
  gather_facts: true
  roles:
    - role: remote_syslog
    - role: mq_client
