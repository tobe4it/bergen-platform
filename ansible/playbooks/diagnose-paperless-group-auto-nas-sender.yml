---
# READ ONLY and privacy preserving. Replays exactly the NAS sender-receipt
# inventory step where group-auto aborts with ok=9. The raw source file names,
# SSH responses, PDF hashes and tracebacks are NEVER logged by Ansible.
# Prints an allowlisted exception class only, not any uncontrolled stderr.
- name: Diagnose blocked Paperless group archive sender receipts, no mutation
  hosts: venombox
  gather_facts: false
  become: true
  tasks:
    - name: Require exact known NAS configuration and no check-mode shortcut
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - not ansible_check_mode
          - synology_admin is defined
          - synology_config is defined
          - synology_config.schema_version == 1
          - synology_config.state_parent is match('^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - synology_config.sync_user is match('^[a-z_][a-z0-9_-]{0,31}$')

    - name: Rerun exact read-only NAS originals and SENT-receipt inventory
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/audit_synology_archive_candidates.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: sender_audit_diagnostic
      failed_when: false
      changed_when: false
      no_log: true

    - name: Classify failure without disclosing names, hashes or traceback
      ansible.builtin.set_fact:
        sender_audit_diagnostic_code: >-
          {{
            (sender_audit_diagnostic.stderr |
            regex_findall('(?m)^(?:RuntimeError|ValueError): (SOURCE_NOT_CONFIRMED_SENT|SOURCE_RECEIPT_MISMATCH|SOURCE_CHANGED_OR_HASH_MISMATCH|SOURCE_CHANGED_BEFORE_HASH|INVALID_SENDER_DIGEST_OR_DESTINATION|INVALID_SENDER_DESTINATION|UNSAFE_SOURCE_DIR|UNSAFE_SYNC_LOCK|UNSAFE_RECEIPT|UNKNOWN_RECEIPT_STATE|INVALID_PARENT|CONFIG_PARENT_MISMATCH|RESTRICTED_SYNC_USER_REQUIRED|INVENTORY_LIMIT_EXCEEDED|SOURCE_NOT_STABLE|LOCK_REPLACED|UNSAFE_STATE_DIR|DO_NOT_RUN_AS_ROOT|MANUAL_REVIEW_SOURCE_CHANGED)\b') |
            first | default('UNCLASSIFIED_ERROR', true))
            if sender_audit_diagnostic.rc != 0 else 'VERIFIED'
          }}
        sender_audit_diagnostic_count: >-
          {{
            (sender_audit_diagnostic.stdout_lines | length)
            if sender_audit_diagnostic.rc == 0 else 0
          }}
      no_log: true

    - name: Display privacy-safe exact NAS sender evidence diagnosis
      ansible.builtin.debug:
        msg:
          - "NAS_RECEIPT_AUDIT={{ sender_audit_diagnostic_code }}"
          - "NAS_AUDIT_RETURN_OK={{ sender_audit_diagnostic.rc == 0 }}"
          - "NAS_VERIFIED_ORIGINAL_COUNT={{ sender_audit_diagnostic_count }}"
          - "NAS_PDF_CONTENT_UNCHANGED=true"
          - "NAS_RECEIPTS_UNCHANGED=true"
          - "NO_ARCHIVE_MOVE=true"
          - "NO_PURGE=true"

    - name: Inspect only expected restricted-user Synology supervisor and watcher processes
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/diagnose_synology_watcher_processes.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: watcher_process_diagnostic
      failed_when: false
      changed_when: false
      no_log: true

    - name: Report only allowlisted watcher state markers
      ansible.builtin.debug:
        msg:
          - >-
            {{ (watcher_process_diagnostic.stdout_lines |
                select('match', '^WATCHER_PROCESS_STATE=(SUPERVISED_AND_RUNNING|SUPERVISOR_ONLY|UNSUPERVISED_WATCHER|NOT_RUNNING|DUPLICATE)$') |
                list | first | default('WATCHER_PROCESS_STATE=UNKNOWN', true))
               if watcher_process_diagnostic.rc == 0 else 'WATCHER_PROCESS_STATE=UNKNOWN' }}
          - >-
            {{ (watcher_process_diagnostic.stdout_lines |
                select('match', '^SENDER_ACTIVATION_GATE=(ACTIVE|ABSENT_OR_UNSAFE)$') |
                list | first | default('SENDER_ACTIVATION_GATE=UNKNOWN', true))
               if watcher_process_diagnostic.rc == 0 else 'SENDER_ACTIVATION_GATE=UNKNOWN' }}
          - "NO_FILES_CHANGED=true"

    - name: Classify every v1 source mismatch by verified content versus metadata, without filenames
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/diagnose_synology_v1_receipt_mismatches.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: source_mismatch_diagnostic
      failed_when: false
      changed_when: false
      no_log: true

    - name: Publish only aggregate allowlisted mismatch categories
      ansible.builtin.debug:
        msg: >-
          {{
            (
              (source_mismatch_diagnostic.stdout_lines |
                select('match', '^SOURCE_CLASS (GROUP|PRIVATE) (MATCH|MISSING_RECEIPT|PREPARED_RECEIPT|RECEIPT_IDENTITY_MISMATCH|METADATA_CTIME_ONLY|METADATA_MTIME_CHANGED|FILE_INODE_CHANGED|FILE_SIZE_CHANGED|CONTENT_CHANGED|CONTENT_CHANGED_SAME_STAT|UNSTABLE_DURING_CHECK|INVALID_RECEIPT) [0-9]+$') |
                list)
              if source_mismatch_diagnostic.rc == 0
              else ['SOURCE_DETAILS_UNAVAILABLE']
            )
          }}

    - name: Independently verify prior archived originals for reused group names without NAS changes
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: |
          import base64
          import sys
          import types
          module = types.ModuleType("audit_synology_completed_archive_moves")
          exec(compile(base64.b64decode("{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/audit_synology_completed_archive_moves.py', rstrip=False) | b64encode }}"), "<reviewed-auditor>", "exec"), module.__dict__)
          sys.modules[module.__name__] = module
          {{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/diagnose_synology_group_collision_archive_proof.py', rstrip=False) | indent(10, false) }}
      delegate_to: localhost
      become: false
      register: collision_archive_proof_diagnostic
      failed_when: false
      changed_when: false
      no_log: true

    - name: Show only aggregate proof verification markers, never a document identity
      ansible.builtin.debug:
        msg: >-
          {{
            (
              collision_archive_proof_diagnostic.stdout_lines |
              select('match', '^GROUP_ARCHIVE_PROOF (MATCH|NEW_INODE_PRIOR_ARCHIVE_VERIFIED|NEW_INODE_PRIOR_ARCHIVE_UNVERIFIED|SAME_INODE_SAME_BYTES_DRIFT|SAME_INODE_CONTENT_CHANGED_BLOCKED|UNSTABLE_SOURCE|NO_SENT_RECEIPT|RECEIPT_INVALID) [0-9]+$') | list
            )
            if collision_archive_proof_diagnostic.rc == 0
            else ['GROUP_ARCHIVE_PROOF_UNAVAILABLE']
          }}
