---
# Read-only Paperless permission inventory and in-process API authorization tests.
# No mutations, secrets, document bodies or original filenames are printed.
# APIClient.force_authenticate tests DRF authorization, NOT the OIDC/proxy boundary.
- name: Audit effective Paperless permissions
  hosts: venombox
  become: true
  gather_facts: false

  tasks:
    - name: Require expected guest identity
      ansible.builtin.command:
        argv: [pct, exec, '126', --, hostname, -s]
      register: paperless_audit_hostname
      changed_when: false
      failed_when: paperless_audit_hostname.stdout | trim != 'bergen-paperless'

    - name: Inspect Paperless permissions and test in-process API access
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - podman
          - exec
          - bergen-paperless
          - python
          - /usr/src/paperless/src/manage.py
          - shell
          - -c
          - |
            from django.contrib.auth.models import Group, User
            from documents.models import Document
            from guardian.shortcuts import get_groups_with_perms, get_users_with_perms
            from rest_framework.test import APIClient

            relevant = {
                "add_document", "change_document", "delete_document", "view_document",
                "add_tag", "change_tag", "delete_tag", "view_tag",
                "add_correspondent", "change_correspondent", "delete_correspondent", "view_correspondent",
                "add_documenttype", "change_documenttype", "delete_documenttype", "view_documenttype",
                "add_storagepath", "change_storagepath", "delete_storagepath", "view_storagepath",
                "add_customfield", "change_customfield", "delete_customfield", "view_customfield",
            }
            def relevant_perms(values):
                return sorted(p for p in values if p.startswith("documents.") and p.rsplit(".", 1)[-1] in relevant)

            print("=== ACTIVE USERS AND MODEL-LEVEL PERMISSIONS ===")
            for user in User.objects.filter(is_active=True).order_by("username"):
                print("USER", user.username, "staff=", user.is_staff, "superuser=", user.is_superuser)
                print("  GROUPS", sorted(user.groups.values_list("name", flat=True)))
                print("  GLOBAL", relevant_perms(user.get_all_permissions()))

            print("=== GROUP MODEL-LEVEL PERMISSIONS ===")
            for group in Group.objects.order_by("name"):
                perms = (
                    "%s.%s" % (p.content_type.app_label, p.codename)
                    for p in group.permissions.select_related("content_type").all()
                )
                print("GROUP", group.name, relevant_perms(perms))

            print("=== DOCUMENT OBJECT GRANTS (NO FILENAMES) ===")
            documents = {doc.pk: doc for doc in Document.objects.filter(pk__in=[10, 11, 12, 13])}
            for doc_id in [10, 11, 12, 13]:
                doc = documents.get(doc_id)
                if doc is None:
                    print("MISSING DOCUMENT", doc_id)
                    continue
                print("DOC", doc.pk, "owner=", doc.owner.username if doc.owner else "<none>")
                print("  OBJECT_GROUPS", {
                    group.name: sorted(perms)
                    for group, perms in get_groups_with_perms(doc, attach_perms=True).items()
                })
                print("  OBJECT_USERS", {
                    user.username: sorted(perms)
                    for user, perms in get_users_with_perms(doc, attach_perms=True).items()
                })

            # Expected policy for the CURRENT four representative imported documents.
            # Negative checks must never silently turn into SKIP/PASS.
            cases = [
                ("private_10_owner", "thomas", 10, True),
                ("private_10_spouse", "nadja", 10, False),
                ("private_10_unrelated", "thomas3", 10, False),
                ("private_11_owner", "thomas", 11, True),
                ("private_11_spouse", "nadja", 11, False),
                ("private_11_unrelated", "thomas3", 11, False),
                ("parents_12_thomas", "thomas", 12, True),
                ("parents_12_nadja", "nadja", 12, True),
                ("parents_12_unrelated", "thomas3", 12, False),
                ("family_13_thomas", "thomas", 13, True),
                ("family_13_nadja", "nadja", 13, True),
                ("family_13_unrelated", "thomas3", 13, False),
            ]
            failures = 0
            print("=== IN-PROCESS DRF API AUTHORIZATION: LIST / DETAIL / DOWNLOAD ===")
            users = {}
            for username in sorted({case[1] for case in cases}):
                try:
                    user = User.objects.get(username=username, is_active=True, is_superuser=False)
                    users[username] = user
                except (User.DoesNotExist, User.MultipleObjectsReturned):
                    print("FAIL required active non-superuser identity:", username)
                    failures += 1

            for label, username, doc_id, should_allow in cases:
                if username not in users or doc_id not in documents:
                    print("FAIL", label, "missing identity or document")
                    failures += 1
                    continue
                client = APIClient()
                client.force_authenticate(user=users[username])
                # An in-process request; never use or log API tokens.
                common = {"HTTP_HOST": "127.0.0.1"}
                for operation, path in [
                    ("detail", "/api/documents/%d/" % doc_id),
                    ("download", "/api/documents/%d/download/" % doc_id),
                ]:
                    try:
                        response = client.get(path, **common)
                        status = response.status_code
                        response.close()
                        actual_allow = status == 200
                        valid_status = status == 200 if should_allow else status in (403, 404)
                        passed = actual_allow == should_allow and valid_status
                        print("PASS" if passed else "FAIL", label, operation, "HTTP", status)
                        if not passed:
                            failures += 1
                    except Exception:
                        print("FAIL", label, operation, "request exception (details suppressed)")
                        failures += 1

            for username, user in users.items():
                client = APIClient()
                client.force_authenticate(user=user)
                try:
                    response = client.get("/api/documents/?page_size=1000", HTTP_HOST="127.0.0.1")
                    status = response.status_code
                    data = getattr(response, "data", None)
                    response.close()
                    if status != 200 or not isinstance(data, dict) or not isinstance(data.get("results"), list):
                        raise ValueError("unexpected list response")
                    results = data["results"]
                    if data.get("next") or data.get("count") != len(results):
                        raise ValueError("incomplete list pagination")
                    visible = {int(item["id"]) for item in results}
                    for label, case_user, doc_id, should_allow in cases:
                        if case_user != username:
                            continue
                        passed = (doc_id in visible) == should_allow
                        print("PASS" if passed else "FAIL", label, "list", "visible=", doc_id in visible)
                        if not passed:
                            failures += 1
                except Exception:
                    print("FAIL", username, "list pagination/response error (details suppressed)")
                    failures += 1

            print("NOT_COVERED: real OIDC login, reverse proxy, child identity, search, previews, AI/RAG")
            print("AUDIT_RESULT", "PASS" if failures == 0 else "FAIL", "failures=", failures)
            if failures:
                raise SystemExit(1)
      register: paperless_permission_audit
      changed_when: false
      failed_when: false

    - name: Show Paperless access report
      ansible.builtin.debug:
        var: paperless_permission_audit.stdout_lines

    - name: Fail closed on missing or unexpected effective access
      ansible.builtin.assert:
        that:
          - paperless_permission_audit.rc == 0
          - "'AUDIT_RESULT PASS failures= 0' in paperless_permission_audit.stdout"
        fail_msg: >-
          Paperless effective-access audit failed or was incomplete.
          Inspect the redacted report above; do not enable AI document access.
