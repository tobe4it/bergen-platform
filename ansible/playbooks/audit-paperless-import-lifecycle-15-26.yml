---
# Read-only lifecycle reconciliation. NOT an archive readiness or apply gate.
# All historical receipts remain unchanged, including documents 15 and 26.
- name: Audit live Paperless imports and exactly two explicitly journaled user deletions
  hosts: venombox
  gather_facts: false
  become: true
  vars:
    approved_deleted_document_id: 26
    approved_deleted_15_document_id: 15
    approved_deleted_15_bridge_receipt: 7a92b91deb7b2e8e35f9f710.json
    approved_deleted_bridge_receipt: 1ebb2c1d26d7b1494d28d9cd.json
  tasks:
    - name: Require expected site-local configuration
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - not ansible_check_mode
          - synology_admin is defined
          - synology_config is defined
          - synology_config.schema_version == 1
          - synology_config.state_parent is match('^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - synology_config.sync_user is match('^[a-z_][a-z0-9_-]{0,31}$')

    - name: Check confined Paperless LXC identity
      ansible.builtin.command:
        argv: [pct, config, '126']
      register: lifecycle_guest_config
      changed_when: false

    - name: Require expected unprivileged guest
      ansible.builtin.assert:
        that:
          - "'hostname: bergen-paperless' in lifecycle_guest_config.stdout_lines"
          - "'unprivileged: 1' in lifecycle_guest_config.stdout_lines"
          - "'lxc.apparmor.profile: unconfined' not in lifecycle_guest_config.stdout"

    - name: Require running Paperless guest
      ansible.builtin.command:
        argv: [pct, status, '126']
      register: lifecycle_guest_status
      changed_when: false
      failed_when: "lifecycle_guest_status.rc != 0 or (lifecycle_guest_status.stdout | trim) != 'status: running'"

    - name: Read exactly two published journals as restricted ingest user and verify canonical hashes
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - runuser
          - -u
          - paperless-ingest
          - --
          - python3
          - '-'
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_verified_user_deletion_journals_15_26.py', rstrip=False) }}"
      register: lifecycle_journal
      changed_when: false

    - name: Verify live Paperless absence of exactly document 26
      ansible.builtin.command:
        argv: [pct, exec, '126', --, python3, '-', "{{ approved_deleted_bridge_receipt }}", "{{ approved_deleted_document_id | string }}"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_import_candidate.py', rstrip=False) }}"
      register: lifecycle_deleted_paperless
      changed_when: false

    - name: Recheck absent NAS source and historical SENT receipt under sender lock
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_by_user_nas_evidence.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: lifecycle_deleted_nas
      changed_when: false

    - name: Verify live Paperless absence of exactly document 15
      ansible.builtin.command:
        argv: [pct, exec, '126', --, python3, '-', "{{ approved_deleted_15_bridge_receipt }}", "{{ approved_deleted_15_document_id | string }}"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_import_candidate.py', rstrip=False) }}"
      register: lifecycle_deleted_paperless_15
      changed_when: false

    - name: Verify absent NAS source and historical SENT receipt for document 15 under sender lock
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
            {{ (lifecycle_deleted_paperless_15.stdout | from_json).receiver_source | quote }}
            {{ (lifecycle_deleted_paperless_15.stdout | from_json).sha256 | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/diagnose_deleted_import_15_nas.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: lifecycle_deleted_nas_15
      changed_when: false

    - name: Verify all remaining NAS originals against SENT receipts and file digests
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/audit_synology_archive_candidates.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: lifecycle_nas_live
      changed_when: false

    - name: Reverify every Paperless import and independently recheck deleted document absence
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_import_lifecycle_15_26.py', rstrip=False) }}"
        stdin: "{{ {'journal': lifecycle_journal.stdout, 'deleted_15': lifecycle_deleted_paperless_15.stdout, 'deleted_26': lifecycle_deleted_paperless.stdout, 'nas_deleted_15': lifecycle_deleted_nas_15.stdout, 'nas_deleted_26': lifecycle_deleted_nas.stdout} | to_json }}"
      register: lifecycle_paperless_live
      changed_when: false

    - name: Match every NAS original to live import or exactly two verified deletions
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../files/paperless/match_paperless_import_lifecycle_15_26.py"
        stdin: "{{ {'nas': lifecycle_nas_live.stdout, 'paperless': lifecycle_paperless_live.stdout, 'journal': lifecycle_journal.stdout, 'nas_deleted_15': lifecycle_deleted_nas_15.stdout, 'nas_deleted_26': lifecycle_deleted_nas.stdout} | to_json }}"
      delegate_to: localhost
      become: false
      register: lifecycle_report
      changed_when: false

    - name: Require complete lifecycle report without archive permission
      ansible.builtin.assert:
        that:
          - "'IMPORT_LIFECYCLE_RECONCILED' in lifecycle_report.stdout_lines"
          - "'DELETED_BY_USER 2' in lifecycle_report.stdout_lines"
          - "(lifecycle_report.stdout_lines | select('match', '^DELETED_BY_USER_CONFIRMED 15 ') | list | length) == 1"
          - "(lifecycle_report.stdout_lines | select('match', '^DELETED_BY_USER_CONFIRMED 26 ') | list | length) == 1"
          - "'ARCHIVE_NOT_AUTHORIZED' in lifecycle_report.stdout_lines"
          - "'NO_RECEIPTS_CHANGED' in lifecycle_report.stdout_lines"
          - "'NO_FILES_CHANGED' in lifecycle_report.stdout_lines"
          - "'ARCHIVE_MATCH_READY' not in lifecycle_report.stdout_lines"

    - name: Display reconciled imports and two confirmed user deletions
      ansible.builtin.debug:
        var: lifecycle_report.stdout_lines
