---
# Read-only preview of a separately confirmed deletion on Paperless AND NAS.
# Historical receipts remain untouched. No archive authorization.
- name: Explicitly gated publication of DELETED_BY_USER journal for document 26
  hosts: venombox
  gather_facts: false
  become: true
  vars:
    approved_deleted_document_id: 26
    approved_deleted_bridge_receipt: 1ebb2c1d26d7b1494d28d9cd.json
    approved_deleted_sender_receipt: 7a9e41ee25d2a98c4e529472f3db2ab6c70b453a3214c1da537175bbcef1b4e8.json
  tasks:
    - name: Require separate approval for exact document 26 journal publication
      ansible.builtin.assert:
        that:
          - paperless_user_deletion_journal_apply_approved | default(false) | bool
          - not ansible_check_mode
          - approved_deleted_document_id == 26
          - approved_deleted_bridge_receipt == '1ebb2c1d26d7b1494d28d9cd.json'
          - approved_deleted_sender_receipt == '7a9e41ee25d2a98c4e529472f3db2ab6c70b453a3214c1da537175bbcef1b4e8.json'
        fail_msg: USER_DELETION_JOURNAL_WRITE_NOT_APPROVED
    - name: Require expected site-local configuration
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - not ansible_check_mode
          - synology_admin is defined
          - synology_config is defined
          - synology_config.schema_version == 1
          - synology_config.state_parent is match('^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - synology_config.sync_user is match('^[a-z_][a-z0-9_-]{0,31}$')
    - name: Check expected Paperless guest
      ansible.builtin.command:
        argv: [pct, config, '126']
      register: deleted_guest_config
      changed_when: false
    - name: Require confined guest identity
      ansible.builtin.assert:
        that:
          - "'hostname: bergen-paperless' in deleted_guest_config.stdout_lines"
          - "'unprivileged: 1' in deleted_guest_config.stdout_lines"
          - "'lxc.apparmor.profile: unconfined' not in deleted_guest_config.stdout"
    - name: Read and verify Paperless document 26 is absent
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - python3
          - '-'
          - "{{ approved_deleted_bridge_receipt }}"
          - "{{ approved_deleted_document_id | string }}"
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_import_candidate.py', rstrip=False) }}"
      register: deleted_paperless_proof
      changed_when: false
    - name: Verify historical SENT receipt and absent NAS source under sender lock
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_by_user_nas_evidence.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: deleted_nas_proof
      changed_when: false
    - name: Compare deletion evidence without changing journals or files
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../files/paperless/preview_deleted_by_user_policy.py"
        stdin: "{{ {'nas': deleted_nas_proof.stdout, 'deleted': deleted_paperless_proof.stdout, 'approved_document_id': approved_deleted_document_id, 'approved_bridge_receipt': approved_deleted_bridge_receipt, 'approved_sender_receipt': approved_deleted_sender_receipt} | to_json }}"
      delegate_to: localhost
      become: false
      register: deleted_user_preview
      changed_when: false
    - name: Preview proposed DELETED_BY_USER journal record without writing
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../files/paperless/deleted_by_user_decision_journal.py"
        stdin: "{{ {'nas': deleted_nas_proof.stdout, 'deleted': deleted_paperless_proof.stdout} | to_json }}"
      delegate_to: localhost
      become: false
      register: deleted_user_journal_preview
      changed_when: false
    - name: Inspect private journal directory and target as restricted ingest user
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - runuser
          - -u
          - paperless-ingest
          - --
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/plan_deleted_by_user_journal_target.py', rstrip=False) }}"
        stdin: >-
          {{ (deleted_user_journal_preview.stdout_lines
              | select('match', '^PROPOSED_USER_DELETION_JOURNAL_JSON ')
              | list | first
              | regex_replace('^PROPOSED_USER_DELETION_JOURNAL_JSON ', '')) }}
      register: deleted_user_journal_target_plan
      changed_when: false
    - name: Require safe private journal target without writing
      ansible.builtin.assert:
        that:
          - "'JOURNAL_DIRECTORY_PRIVATE_VERIFIED' in deleted_user_journal_target_plan.stdout_lines"
          - "'NO_JOURNAL_WRITTEN' in deleted_user_journal_target_plan.stdout_lines"
          - "'NO_RECEIPTS_CHANGED' in deleted_user_journal_target_plan.stdout_lines"
          - "'NO_FILES_CHANGED' in deleted_user_journal_target_plan.stdout_lines"
          - "((deleted_user_journal_target_plan.stdout_lines | select('match', '^READY_TO_PUBLISH ') | list | length) == 1) or ((deleted_user_journal_target_plan.stdout_lines | select('match', '^ALREADY_IDENTICAL ') | list | length) == 1)"
    - name: Show journal storage readiness
      ansible.builtin.debug:
        var: deleted_user_journal_target_plan.stdout_lines
    - name: Show proposed journal identity and payload
      ansible.builtin.debug:
        var: deleted_user_journal_preview.stdout_lines
    - name: Show read-only deletion preview
      ansible.builtin.debug:
        var: deleted_user_preview.stdout_lines
    - name: Assert no archive authorization or mutation
      ansible.builtin.assert:
        that:
          - "'EXCLUDED_FROM_ARCHIVE_MATCH_READY' in deleted_user_preview.stdout_lines"
          - "'NO_RECEIPT_STATUS_CHANGED' in deleted_user_preview.stdout_lines"
          - "'NO_FILES_CHANGED' in deleted_user_preview.stdout_lines"
          - "'NO_JOURNAL_WRITTEN' in deleted_user_journal_preview.stdout_lines"
          - "'EXCLUDED_FROM_ARCHIVE_MATCH_READY' in deleted_user_journal_preview.stdout_lines"
          - "'NO_FILES_CHANGED' in deleted_user_journal_preview.stdout_lines"
    - name: Recheck Paperless absence immediately before journal publication
      ansible.builtin.command:
        argv: [pct, exec, '126', --, python3, '-', "{{ approved_deleted_bridge_receipt }}", "{{ approved_deleted_document_id | string }}"]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_import_candidate.py', rstrip=False) }}"
      register: deleted_paperless_final_proof
      changed_when: false

    - name: Recheck NAS absence and historical SENT receipt immediately before publication
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n -u {{ synology_config.sync_user | quote }}
            /usr/bin/python3 - {{ synology_config.state_parent | quote }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/export_deleted_by_user_nas_evidence.py', rstrip=False) }}"
      delegate_to: localhost
      become: false
      register: deleted_nas_final_proof
      changed_when: false

    - name: Require evidence unchanged since approved read-only plan
      ansible.builtin.assert:
        that:
          - deleted_paperless_final_proof.stdout == deleted_paperless_proof.stdout
          - deleted_nas_final_proof.stdout == deleted_nas_proof.stdout

    - name: Validate final fresh evidence with independent deletion policy
      ansible.builtin.command:
        argv: [python3, "{{ playbook_dir }}/../files/paperless/preview_deleted_by_user_policy.py"]
        stdin: "{{ {'nas': deleted_nas_final_proof.stdout, 'deleted': deleted_paperless_final_proof.stdout, 'approved_document_id': approved_deleted_document_id, 'approved_bridge_receipt': approved_deleted_bridge_receipt, 'approved_sender_receipt': approved_deleted_sender_receipt} | to_json }}"
      delegate_to: localhost
      become: false
      register: deleted_user_final_policy
      changed_when: false

    - name: Require final policy confirmation before the only write
      ansible.builtin.assert:
        that:
          - "'PREVIEW_DELETED_BY_USER 26 bridge ' in deleted_user_final_policy.stdout"
          - "'NAS_ORIGINAL_CONFIRMED_ABSENT' in deleted_user_final_policy.stdout_lines"
          - "'PAPERLESS_DOCUMENT_CONFIRMED_ABSENT' in deleted_user_final_policy.stdout_lines"
          - "'NO_FILES_CHANGED' in deleted_user_final_policy.stdout_lines"

    - name: Publish exactly one immutable-named journal record as restricted ingest user
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - runuser
          - -u
          - paperless-ingest
          - --
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/publish_deleted_by_user_journal.py', rstrip=False) }}"
          - --apply
        stdin: >-
          {{ {
            'nas': deleted_nas_final_proof.stdout,
            'deleted': deleted_paperless_final_proof.stdout,
            'schema_source': lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/deleted_by_user_decision_journal.py', rstrip=False),
            'store_source': lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/deleted_by_user_decision_store.py', rstrip=False),
            'plan_source': lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/plan_deleted_by_user_journal_target.py', rstrip=False)
          } | to_json }}
      register: deleted_user_journal_published
      changed_when: "'JOURNAL_CREATED_AND_VERIFIED' in deleted_user_journal_published.stdout_lines"

    - name: Require durable verified journal and unchanged receipts
      ansible.builtin.assert:
        that:
          - "('JOURNAL_CREATED_AND_VERIFIED' in deleted_user_journal_published.stdout_lines) or ('JOURNAL_ALREADY_IDENTICAL_AND_VERIFIED' in deleted_user_journal_published.stdout_lines)"
          - "'JOURNAL_FILENAME f4ec236e1eec5af84a73a3fa528c7bd2afa41307c4319a2ac8b26643dbdb0e26.json' in deleted_user_journal_published.stdout_lines"
          - "'JOURNAL_SHA256 5e0030686637d7feb85d7a8607ada78d22c224e31d77f053ba14f4dc6ace7d0a' in deleted_user_journal_published.stdout_lines"
          - "'NO_RECEIPTS_CHANGED' in deleted_user_journal_published.stdout_lines"
          - "'NO_REIMPORT_OR_RESTORE' in deleted_user_journal_published.stdout_lines"
          - "'NO_ARCHIVE_AUTHORIZATION' in deleted_user_journal_published.stdout_lines"

    - name: Show journal publication result
      ansible.builtin.debug:
        var: deleted_user_journal_published.stdout_lines
