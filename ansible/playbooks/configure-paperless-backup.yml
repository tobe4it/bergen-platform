---
# Configures ONLY the chosen Proxmox host, never the Paperless guest itself.
# No timer is enabled without a separate explicit approval flag.
- name: Manage isolated Bergen Paperless Proxmox backup timer
  hosts: "{{ paperless_backup_pve_host | default('__no_backup_host_selected__') }}"
  gather_facts: false
  become: true
  serial: 1
  roles:
    - role: proxmox_vzdump_backup
