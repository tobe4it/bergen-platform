---
# Create-only LDAP provisioning for dedicated MQ transport MCA identities.
# Default: read-only inspection. Writes require explicit operator approval and
# privileged bind credentials from a local Ansible Vault variable file.
# No password is assigned to these certificate-mapped service identities.
- name: Inspect or explicitly provision MQ transport LDAP identities
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    transport_ldap_uri: ldaps://ldap.thebergens.net:636
    transport_ldap_base: dc=bergen,dc=intern
    transport_ldap_primary_gid: 1000001
    transport_ldap_accounts:
      - {uid: bgttransa, uid_number: 1000016, group: MQBGTTRANSA, group_gid: 1000016}
      - {uid: bgttransb, uid_number: 1000017, group: MQBGTTRANSB, group_gid: 1000017}
    transport_ldap_expected_dns:
      - uid=bgttransa,cn=users,dc=bergen,dc=intern
      - uid=bgttransb,cn=users,dc=bergen,dc=intern
      - cn=MQBGTTRANSA,cn=groups,dc=bergen,dc=intern
      - cn=MQBGTTRANSB,cn=groups,dc=bergen,dc=intern
    transport_ldap_apply: "{{ mq_transport_ldap_apply | default(false) | bool }}"
  tasks:
    - name: Require exact identities and explicit write consent
      ansible.builtin.assert:
        that:
          - transport_ldap_uri == 'ldaps://ldap.thebergens.net:636'
          - transport_ldap_base == 'dc=bergen,dc=intern'
          - transport_ldap_accounts | length == 2
          - (transport_ldap_accounts | map(attribute='uid') | list) == ['bgttransa', 'bgttransb']
          - (transport_ldap_accounts | map(attribute='group') | list) == ['MQBGTTRANSA', 'MQBGTTRANSB']
          - not transport_ldap_apply or (mq_transport_ldap_write_approved | default(false) | bool)
          - not transport_ldap_apply or not ansible_check_mode
          - not transport_ldap_apply or (mq_transport_ldap_schema_approved | default(false) | bool)
          - not transport_ldap_apply or (mq_transport_ldap_bind_dn | default('') | length > 0)
          - not transport_ldap_apply or (mq_transport_ldap_bind_password | default('') | length > 0)
        fail_msg: >-
          Preview only by default. Creating LDAP identities requires separately
          approved Synology schema, vaulted admin credentials and explicit write
          consent. This playbook does not grant MQ authorities.

    - name: Prepare private temporary directory for admin bind secret only on apply
      ansible.builtin.tempfile:
        state: directory
        prefix: bgt-transport-ldap-
      register: transport_ldap_secret_dir
      when: transport_ldap_apply
      no_log: true

    - name: Perform guarded provisioning and cleanup secret even on failure
      block:
        - name: Store bind password in restricted short-lived file
          ansible.builtin.copy:
            dest: "{{ transport_ldap_secret_dir.path }}/bind.pw"
            content: "{{ mq_transport_ldap_bind_password }}"
            mode: '0600'
          when: transport_ldap_apply
          no_log: true

        - name: Establish the privileged LDAP bind before any write
          ansible.builtin.command:
            argv: "{{ ['ldapwhoami', '-x', '-H', transport_ldap_uri, '-D', mq_transport_ldap_bind_dn, '-y', transport_ldap_secret_dir.path ~ '/bind.pw'] }}"
          when: transport_ldap_apply
          changed_when: false
          no_log: true

        - name: Inspect each intended LDAP user without changing it
          ansible.builtin.command:
            argv: >-
              {{ ['ldapsearch', '-LLL', '-x', '-H', transport_ldap_uri] +
                 (['-D', mq_transport_ldap_bind_dn, '-y', transport_ldap_secret_dir.path ~ '/bind.pw'] if transport_ldap_apply else []) +
                 ['-b', 'cn=users,' ~ transport_ldap_base, '-s', 'one',
                  '(uid=' ~ item.uid ~ ')',
                  'dn', 'objectClass', 'uid', 'cn', 'sn', 'uidNumber', 'gidNumber',
                  'homeDirectory', 'loginShell'] }}
          loop: "{{ transport_ldap_accounts }}"
          loop_control:
            label: "{{ item.uid }}"
          register: transport_ldap_user_check
          changed_when: false
          no_log: "{{ transport_ldap_apply }}"

        - name: Inspect each intended LDAP group without changing it
          ansible.builtin.command:
            argv: >-
              {{ ['ldapsearch', '-LLL', '-x', '-H', transport_ldap_uri] +
                 (['-D', mq_transport_ldap_bind_dn, '-y', transport_ldap_secret_dir.path ~ '/bind.pw'] if transport_ldap_apply else []) +
                 ['-b', 'cn=groups,' ~ transport_ldap_base, '-s', 'one',
                  '(cn=' ~ item.group ~ ')',
                  'dn', 'objectClass', 'cn', 'gidNumber', 'member', 'memberUid'] }}
          loop: "{{ transport_ldap_accounts }}"
          loop_control:
            label: "{{ item.group }}"
          register: transport_ldap_group_check
          changed_when: false
          no_log: "{{ transport_ldap_apply }}"

        - name: Check numerical ID collisions throughout the directory
          ansible.builtin.command:
            argv: >-
              {{ ['ldapsearch', '-LLL', '-x', '-H', transport_ldap_uri] +
                 (['-D', mq_transport_ldap_bind_dn, '-y', transport_ldap_secret_dir.path ~ '/bind.pw'] if transport_ldap_apply else []) +
                 ['-b', transport_ldap_base, '-s', 'sub',
                  '(|(uidNumber=1000016)(uidNumber=1000017)(gidNumber=1000016)(gidNumber=1000017))',
                  'dn', 'uidNumber', 'gidNumber'] }}
          register: transport_ldap_id_check
          changed_when: false
          no_log: "{{ transport_ldap_apply }}"

        - name: Require existing users to match the exact intended immutable attributes
          ansible.builtin.assert:
            that:
              - >-
                (item.stdout | trim) == '' or (
                  ('dn: uid=' ~ item.item.uid ~ ',cn=users,' ~ transport_ldap_base) in item.stdout_lines
                  and ('uid: ' ~ item.item.uid) in item.stdout_lines
                  and ('cn: ' ~ item.item.uid) in item.stdout_lines
                  and ('sn: ' ~ item.item.uid) in item.stdout_lines
                  and ('uidNumber: ' ~ (item.item.uid_number | string)) in item.stdout_lines
                  and ('gidNumber: ' ~ (transport_ldap_primary_gid | string)) in item.stdout_lines
                  and ('homeDirectory: /nonexistent/' ~ item.item.uid) in item.stdout_lines
                  and 'loginShell: /bin/false' in item.stdout_lines
                  and 'objectClass: inetOrgPerson' in item.stdout_lines
                  and 'objectClass: posixAccount' in item.stdout_lines
                )
            fail_msg: "Existing LDAP user differs from desired safe service identity; do not overwrite."
          loop: "{{ transport_ldap_user_check.results }}"
          loop_control:
            label: "{{ item.item.uid }}"
          no_log: "{{ transport_ldap_apply }}"

        - name: Require existing groups to match the exact intended transport membership
          ansible.builtin.assert:
            that:
              - >-
                (item.stdout | trim) == '' or (
                  ('dn: cn=' ~ item.item.group ~ ',cn=groups,' ~ transport_ldap_base) in item.stdout_lines
                  and ('cn: ' ~ item.item.group) in item.stdout_lines
                  and ('gidNumber: ' ~ (item.item.group_gid | string)) in item.stdout_lines
                  and ('member: uid=' ~ item.item.uid ~ ',cn=users,' ~ transport_ldap_base) in item.stdout_lines
                  and ('memberUid: ' ~ item.item.uid) in item.stdout_lines
                  and 'objectClass: posixGroup' in item.stdout_lines
                )
            fail_msg: "Existing LDAP group differs from desired scoped membership; do not overwrite."
          loop: "{{ transport_ldap_group_check.results }}"
          loop_control:
            label: "{{ item.item.group }}"
          no_log: "{{ transport_ldap_apply }}"

        - name: Reject any numerical ID used by another DN
          ansible.builtin.assert:
            that:
              - >-
                ((transport_ldap_id_check.stdout |
                   regex_findall('(?m)^dn: (.+)$')) |
                 difference(transport_ldap_expected_dns) | length) == 0
            fail_msg: "Numeric LDAP identity collision; abort without modifying existing entries."
          no_log: "{{ transport_ldap_apply }}"

        - name: Confirm existing primary POSIX group
          ansible.builtin.command:
            argv: >-
              {{ ['ldapsearch', '-LLL', '-x', '-H', transport_ldap_uri] +
                 (['-D', mq_transport_ldap_bind_dn, '-y', transport_ldap_secret_dir.path ~ '/bind.pw'] if transport_ldap_apply else []) +
                 ['-b', 'cn=groups,' ~ transport_ldap_base, '-s', 'one',
                  '(gidNumber=1000001)', 'dn', 'gidNumber'] }}
          register: transport_ldap_primary_group
          changed_when: false
          no_log: "{{ transport_ldap_apply }}"

        - name: Ensure primary POSIX group is present
          ansible.builtin.assert:
            that:
              - transport_ldap_primary_group.stdout is search('(?m)^dn: ')
            fail_msg: "Primary POSIX group GID 1000001 is not visible; refuse provisioning."
          no_log: "{{ transport_ldap_apply }}"

        - name: Create only absent LDAP transport user entries
          ansible.builtin.command:
            argv:
              - ldapadd
              - -x
              - -H
              - "{{ transport_ldap_uri }}"
              - -D
              - "{{ mq_transport_ldap_bind_dn }}"
              - -y
              - "{{ transport_ldap_secret_dir.path }}/bind.pw"
            stdin: |
              dn: uid={{ item.uid }},cn=users,{{ transport_ldap_base }}
              objectClass: top
              objectClass: person
              objectClass: organizationalPerson
              objectClass: inetOrgPerson
              objectClass: posixAccount
              cn: {{ item.uid }}
              sn: {{ item.uid }}
              uid: {{ item.uid }}
              uidNumber: {{ item.uid_number }}
              gidNumber: {{ transport_ldap_primary_gid }}
              homeDirectory: /nonexistent/{{ item.uid }}
              loginShell: /bin/false
          loop: "{{ transport_ldap_accounts }}"
          loop_control:
            index_var: transport_index
            label: "{{ item.uid }}"
          when:
            - transport_ldap_apply
            - (transport_ldap_user_check.results[transport_index].stdout | trim) == ''
          no_log: true

        - name: Create only absent LDAP transport group entries
          ansible.builtin.command:
            argv:
              - ldapadd
              - -x
              - -H
              - "{{ transport_ldap_uri }}"
              - -D
              - "{{ mq_transport_ldap_bind_dn }}"
              - -y
              - "{{ transport_ldap_secret_dir.path }}/bind.pw"
            stdin: |
              dn: cn={{ item.group }},cn=groups,{{ transport_ldap_base }}
              objectClass: top
              objectClass: posixGroup
              objectClass: extensibleObject
              cn: {{ item.group }}
              gidNumber: {{ item.group_gid }}
              member: uid={{ item.uid }},cn=users,{{ transport_ldap_base }}
              memberUid: {{ item.uid }}
          loop: "{{ transport_ldap_accounts }}"
          loop_control:
            index_var: transport_index
            label: "{{ item.group }}"
          when:
            - transport_ldap_apply
            - (transport_ldap_group_check.results[transport_index].stdout | trim) == ''
          no_log: true

        - name: Confirm no write was attempted in inspection mode
          ansible.builtin.debug:
            msg: >-
              READ-ONLY PASS: LDAP transport candidates were examined;
              existing entries (if any) match exactly, and no unrelated
              DN uses the planned numeric IDs. No LDAP or MQ change.
          when: not transport_ldap_apply

        - name: Report completed LDAP creation requires independent verification
          ansible.builtin.debug:
            msg: >-
              LDAP add requests completed. Independently verify the two users,
              group memberships and MQ SEARCHGRP resolution before CHLAUTH
              or OAM grants. Partial failure requires manual inspection.
          when: transport_ldap_apply
      always:
        - name: Remove temporary LDAP administrative bind secret
          ansible.builtin.file:
            path: "{{ transport_ldap_secret_dir.path }}"
            state: absent
          when:
            - transport_ldap_apply
            - transport_ldap_secret_dir.path is defined
          no_log: true
