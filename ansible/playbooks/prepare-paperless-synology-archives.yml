---
# Safe, idempotent NAS quarantine directory provisioning and initial ownership adoption.
# Does not archive/move PDFs, enable sync, or delete files.
# Can be run while the Synology ingest watcher is live.
- name: Prepare private NAS short-term Paperless quarantine directories
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Require NAS site-local settings
      ansible.builtin.assert:
        that:
          - synology_admin is defined
          - synology_admin is match('^[A-Za-z_][A-Za-z0-9_.-]*@[A-Za-z0-9][A-Za-z0-9.-]+$')
          - synology_config is defined
          - synology_config.schema_version == 1
          - synology_config.state_parent is match('^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - synology_config.sources is defined
        fail_msg: "Pass the existing ignored paperless-synology.local.yml"

    - name: Create or safely adopt paperless-sync-owned quarantine directory structure
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - "sudo -n /usr/bin/python3 - {{ synology_config.state_parent | quote }}"
        stdin: |
          import datetime
          import os
          import pwd
          import stat
          import sys
          from pathlib import Path

          if os.geteuid() != 0:
              raise SystemExit("ROOT_REQUIRED")
          os.umask(0o077)
          parent = Path(sys.argv[1])
          root = parent.parent
          bindir = parent / "bin"

          def require_dir(path, uid, gid, mode):
              st = path.lstat()
              if (not stat.S_ISDIR(st.st_mode) or st.st_uid != uid
                      or st.st_gid != gid or stat.S_IMODE(st.st_mode) != mode):
                  raise RuntimeError("UNSAFE_EXISTING_DIRECTORY " + str(path))

          # Root-owned application state and code are never changed.
          require_dir(root, 0, 0, 0o755)
          require_dir(parent, 0, 0, 0o755)
          require_dir(bindir, 0, 0, 0o755)
          sys.path.insert(0, str(bindir))
          from synology_config import SETTINGS
          if SETTINGS["parent"] != parent:
              raise RuntimeError("CONFIG_PARENT_MISMATCH")

          account = pwd.getpwnam(SETTINGS["sync_user"])
          uid, gid = account.pw_uid, account.pw_gid
          if uid == 0 or gid == 0:
              raise RuntimeError("UNSAFE_SYNC_IDENTITY")

          archive = parent / "paperless-archive"
          month = datetime.date.today().strftime("%Y-%m")
          wanted = {archive}
          for _source, scope in SETTINGS["sources"]:
              dest = archive
              for part in scope.split("/"):
                  dest = dest / part
                  wanted.add(dest)
              wanted.add(dest / month)

          ordered = sorted(wanted, key=lambda p: (len(p.parts), str(p)))
          adoption_required = False

          # Complete preflight: allow only secure, known owner/mode combinations.
          # The former version provisioned root:root 0700. No general chown -R.
          for path in ordered:
              try:
                  st = path.lstat()
              except FileNotFoundError:
                  continue
              if not stat.S_ISDIR(st.st_mode) or stat.S_IMODE(st.st_mode) != 0o700:
                  raise RuntimeError("UNSAFE_ARCHIVE_DIRECTORY " + str(path))
              owner = (st.st_uid, st.st_gid)
              if owner == (0, 0):
                  adoption_required = True
              elif owner != (uid, gid):
                  raise RuntimeError("UNEXPECTED_ARCHIVE_OWNER " + str(path))

          # Do not accidentally expose existing root-protected archive content
          # to the service account during the one-time owner migration.
          # The production NAS archive is known to be empty at creation.
          if adoption_required and archive.exists():
              for current, dirs, files in os.walk(str(archive), followlinks=False):
                  base = Path(current)
                  if base not in wanted or files:
                      raise RuntimeError("NONEMPTY_OR_UNKNOWN_LEGACY_ARCHIVE " + str(base))
                  for name in dirs:
                      child = base / name
                      if child not in wanted or child.is_symlink():
                          raise RuntimeError("UNKNOWN_LEGACY_ARCHIVE_CHILD " + str(child))

          for path in ordered:
              try:
                  os.mkdir(str(path), 0o700)
                  os.chown(str(path), uid, gid)
                  print("CREATED", str(path), flush=True)
              except FileExistsError:
                  st = path.lstat()
                  if (not stat.S_ISDIR(st.st_mode)
                          or stat.S_IMODE(st.st_mode) != 0o700):
                      raise RuntimeError("UNSAFE_EXISTING_DIRECTORY " + str(path))
                  if (st.st_uid, st.st_gid) == (0, 0):
                      os.chown(str(path), uid, gid)
                      print("ADOPTED", str(path), flush=True)
                  else:
                      print("EXISTS", str(path), flush=True)
              require_dir(path, uid, gid, 0o700)

          print("PAPERLESS_QUARANTINE_DIRS_READY", len(SETTINGS["sources"]), "scopes", flush=True)
      register: paperless_archive_prep
      changed_when: "'CREATED ' in paperless_archive_prep.stdout or 'ADOPTED ' in paperless_archive_prep.stdout"

    - name: Display NAS archive provisioning status
      ansible.builtin.debug:
        var: paperless_archive_prep.stdout_lines
