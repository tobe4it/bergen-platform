---
# Read-only native DSM ACL inspection; default is pre-provision audit.
# Opt-in strict mode requires every hidden archive and the private journal.
# Never mkdir, chmod, setfacl, rename, move or delete user files.
- name: Inspect Synology ACLs for Paperless scan inputs and hidden archives
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Validate site-local Synology configuration
      ansible.builtin.assert:
        that:
          - synology_admin is defined
          - synology_admin is match('^[A-Za-z_][A-Za-z0-9_.-]*@[A-Za-z0-9][A-Za-z0-9.-]+$')
          - synology_config is defined
          - synology_config.schema_version == 1
          - synology_config.state_parent is match('^/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
          - synology_config.sync_user == 'paperless-sync'
          - (paperless_require_hidden_archives | default(false)) is boolean

    - name: Query native DSM ACLs using root for read-only inspection
      ansible.builtin.command:
        argv:
          - ssh
          - -T
          - -o
          - BatchMode=yes
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - ConnectTimeout=15
          - "{{ synology_admin }}"
          - >-
            sudo -n /usr/bin/python3 - {{ synology_config.state_parent | quote }}
            {{ '--require-hidden' if (paperless_require_hidden_archives | default(false) | bool) else '' }}
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/paperless/audit_synology_scan_acls.py', rstrip=False) }}"
      register: paperless_dsm_acl_audit
      changed_when: false

    - name: Show native DSM ACL findings before strict verdict
      ansible.builtin.debug:
        var: paperless_dsm_acl_audit.stdout_lines

    - name: Require read-only report without ACL blockers
      ansible.builtin.assert:
        that:
          - "'NO_FILES_CHANGED' in paperless_dsm_acl_audit.stdout_lines"
          - "'BLOCKER ' not in paperless_dsm_acl_audit.stdout"
          - "'REVIEW_REQUIRED Familie SYNC_USER_DELETE_CHILD_RENAME_AND_ACL_INHERITANCE' in paperless_dsm_acl_audit.stdout_lines"
          - "'REVIEW_REQUIRED Eltern SYNC_USER_DELETE_CHILD_RENAME_AND_ACL_INHERITANCE' in paperless_dsm_acl_audit.stdout_lines"
          - "'REVIEW_REQUIRED Privat/thomas SYNC_USER_DELETE_CHILD_RENAME_AND_ACL_INHERITANCE' in paperless_dsm_acl_audit.stdout_lines"
          - "'REVIEW_REQUIRED Privat/nadja SYNC_USER_DELETE_CHILD_RENAME_AND_ACL_INHERITANCE' in paperless_dsm_acl_audit.stdout_lines"
          - >-
            not (paperless_require_hidden_archives | default(false) | bool) or
            'ARCHIVE_JOURNAL_PRESENT' in paperless_dsm_acl_audit.stdout_lines
          - >-
            not (paperless_require_hidden_archives | default(false) | bool) or
            'HIDDEN_ARCHIVE_POSIX_PRIVATE Privat/thomas' in paperless_dsm_acl_audit.stdout_lines
          - >-
            not (paperless_require_hidden_archives | default(false) | bool) or
            'HIDDEN_ARCHIVE_POSIX_PRIVATE Privat/nadja' in paperless_dsm_acl_audit.stdout_lines
          - >-
            not (paperless_require_hidden_archives | default(false) | bool) or
            'HIDDEN_ARCHIVE_POSIX_PRIVATE Eltern' in paperless_dsm_acl_audit.stdout_lines
          - >-
            not (paperless_require_hidden_archives | default(false) | bool) or
            'HIDDEN_ARCHIVE_POSIX_PRIVATE Familie' in paperless_dsm_acl_audit.stdout_lines
        fail_msg: "Synology archive ACL check incomplete or unsafe: review POSIX mode and effective-user access before any real move"
