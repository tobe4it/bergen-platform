---
# Explicit production gate; NEVER run from the one-shot audit/pilot playbook.
- name: Deploy separately approved Paperless AI inbox timer
  hosts: venombox
  become: true
  gather_facts: false
  vars:
    bp_ai_timer_conf_dir: /etc/bergen-platform/paperless-ai
    bp_ai_timer_allowed_group: "{{ paperless_ai_catalog_allowed_group | default('') }}"
    bp_ai_timer_model: "{{ paperless_ai_catalog_model | default('') }}"
    bp_ai_timer_endpoint: "{{ paperless_ai_catalog_endpoint | default('') }}"
    bp_ai_timer_watermark: "{{ paperless_ai_catalog_min_document_id | default(0) | int }}"
    bp_ai_timer_auto_watermark: "{{ paperless_ai_catalog_initial_use_current_max_id | default(false) | bool }}"
  tasks:
    - name: Demand reviewed backups, local group, tested pilot and independent timer activation
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - not ansible_check_mode
          - paperless_ai_catalog_timer_activate | default(false) | bool
          - paperless_ai_catalog_timer_approved | default(false) | bool
          - paperless_ai_catalog_verified_backup | default(false) | bool
          - paperless_ai_catalog_pilot_passed | default(false) | bool
          - paperless_ai_catalog_notes_enabled | default(false) | bool
          - paperless_ai_catalog_notes_approved | default(false) | bool
          - paperless_native_ai_ui_approved | default(false) | bool
          - paperless_ai_catalog_approved | default(false) | bool
          - bp_ai_timer_watermark > 0 or bp_ai_timer_auto_watermark
          - bp_ai_timer_allowed_group is match('^[^\s@]+@[^\s@]+$')
          - bp_ai_timer_model is match('^[A-Za-z0-9_.:-]{1,96}$')
          - bp_ai_timer_endpoint is match('^http://[A-Za-z0-9.:-]+:11434/?$')
          - paperless_ai_catalog_pilot_ids | default([]) | length == 0
        fail_msg: AUTOMATIC_PAPERLESS_AI_ROLLOUT_NOT_APPROVED
      no_log: true

    - name: Inspect the existing confined Paperless LXC
      ansible.builtin.command:
        argv: [pct, config, '126']
      register: bp_ai_timer_guest
      changed_when: false
      check_mode: false
      no_log: true

    - name: Reject unexpected guest identity or insecure confinement
      ansible.builtin.assert:
        that:
          - bp_ai_timer_guest.rc == 0
          - "'hostname: bergen-paperless' in bp_ai_timer_guest.stdout_lines"
          - "'unprivileged: 1' in bp_ai_timer_guest.stdout_lines"
          - "'lxc.apparmor.profile: unconfined' not in bp_ai_timer_guest.stdout"
      no_log: true

    - name: Read currently installed Paperless version
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - podman
          - exec
          - bergen-paperless
          - python
          - -c
          - "from paperless.version import __full_version_str__; print(__full_version_str__)"
      register: bp_ai_timer_version
      changed_when: false
      no_log: true

    - name: Require exact reviewed Paperless 3.3.0
      ansible.builtin.assert:
        that:
          - bp_ai_timer_version.rc == 0
          - bp_ai_timer_version.stdout | trim == '3.3.0'
        fail_msg: PAPERLESS_VERSION_UNREVIEWED
      no_log: true

    - name: Read highest current Paperless document ID from its running ORM
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - podman
          - exec
          - bergen-paperless
          - python
          - /usr/src/paperless/src/manage.py
          - shell
          - --verbosity=0
          - -c
          - "from documents.models import Document; print('CATALOG_MAX_ID=' + str(Document.objects.order_by('-pk').values_list('pk',flat=True).first() or 0))"
      register: bp_ai_timer_max_doc
      changed_when: false
      no_log: true

    - name: Require exactly one sanitized maximum ID result
      ansible.builtin.set_fact:
        bp_ai_timer_max_lines: >-
          {{ bp_ai_timer_max_doc.stdout_lines |
             select('match', '^CATALOG_MAX_ID=[0-9]+$') | list }}
      changed_when: false
      no_log: true

    - name: Pin a single live snapshot as first-activation watermark
      ansible.builtin.set_fact:
        bp_ai_timer_effective_watermark: >-
          {{ (bp_ai_timer_max_lines[0] | regex_replace('^CATALOG_MAX_ID=', '') | int)
             if bp_ai_timer_auto_watermark else (bp_ai_timer_watermark | int) }}
      no_log: true

    - name: Reject historical-document reclassification with wrong watermark
      ansible.builtin.assert:
        that:
          - bp_ai_timer_max_doc.rc == 0
          - bp_ai_timer_max_lines | length == 1
          - bp_ai_timer_effective_watermark | int > 0
          - bp_ai_timer_effective_watermark | int == (bp_ai_timer_max_lines[0] | regex_replace('^CATALOG_MAX_ID=', '') | int)
        fail_msg: WATERMARK_MUST_EQUAL_LIVE_MAX_DOCUMENT_ID
      no_log: true

    - name: Read only production AI, parent Note permissions and embedding preconditions
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - podman
          - exec
          - -i
          - bergen-paperless
          - python
          - /usr/src/paperless/src/manage.py
          - shell
          - --verbosity=0
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/paperless/bergen_ai_catalog_timer_readiness.py', rstrip=False) }}"
        stdin: >-
          {{ {'protocol': 'catalog-timer-ready-v1',
              'model': bp_ai_timer_model,
              'endpoint': bp_ai_timer_endpoint,
              'group': bp_ai_timer_allowed_group} | to_json }}
        stdin_add_newline: true
      register: bp_timer_ready_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: Extract exactly one non-identifying readiness frame
      ansible.builtin.set_fact:
        bp_timer_ready_frames: >-
          {{ bp_timer_ready_raw.stdout_lines | default([]) |
             select('match', '^BERGEN_PAPERLESS_AI_TIMER_READINESS_V1:') | list }}
      no_log: true

    - name: Fail closed if no verified AI UI or scoped native note rights
      ansible.builtin.assert:
        that:
          - bp_timer_ready_raw.rc == 0
          - bp_timer_ready_frames | length == 1
          - bp_timer_ready_frames[0] | length < 900
          - (bp_timer_ready_frames[0] |
             regex_replace('^BERGEN_PAPERLESS_AI_TIMER_READINESS_V1:', '') |
             from_json).STATUS == 'READY'
          - (bp_timer_ready_frames[0] |
             regex_replace('^BERGEN_PAPERLESS_AI_TIMER_READINESS_V1:', '') |
             from_json).CHANGED == false
        fail_msg: PAPERLESS_AI_TIMER_PARENT_NOTES_OR_UI_NOT_READY
      no_log: true

    - name: Inspect whether a timer was already enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, bergen-ai-catalog.timer]
      register: bp_ai_timer_previous
      changed_when: false
      failed_when: false
      no_log: true

    - name: Refuse unapproved changes to existing automatic jobs
      ansible.builtin.assert:
        that:
          - not bp_ai_timer_auto_watermark or bp_ai_timer_previous.stdout | trim != 'enabled'
          - bp_ai_timer_previous.stdout | trim != 'enabled' or
            (paperless_ai_catalog_timer_upgrade_approved | default(false) | bool)
        fail_msg: EXISTING_AI_AUTOMATION_REQUIRES_SEPARATE_UPGRADE_APPROVAL
      no_log: true

    - name: Create private root-owned policy directory
      ansible.builtin.file:
        path: "{{ bp_ai_timer_conf_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install reviewed native Paperless Python policy and worker
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/paperless/{{ item }}"
        dest: "{{ bp_ai_timer_conf_dir }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - bergen_ai_catalog_policy.py
        - bergen_ai_catalog_runner.py
      no_log: true

    - name: Install protected runtime settings for only post-watermark documents
      ansible.builtin.copy:
        content: >-
          {{ {
              'protocol': 'catalog-v1',
              'mode': 'apply',
              'allowed_group': bp_ai_timer_allowed_group,
              'expected_model': bp_ai_timer_model,
              'expected_endpoint': bp_ai_timer_endpoint,
              'min_document_id': bp_ai_timer_effective_watermark | int,
              'pilot_ids': [],
              'batch_size': 1,
              'approved': true,
              'notes_enabled': true
             } | to_json }}
        dest: "{{ bp_ai_timer_conf_dir }}/catalog-policy.json"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Install dedicated Proxmox-local launcher
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/paperless/bergen-ai-catalog-run.sh"
        dest: /usr/local/libexec/bergen-ai-catalog-run
        owner: root
        group: root
        mode: '0750'
      no_log: true

    - name: Install independent one-shot systemd service and timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/paperless/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - bergen-ai-catalog.service
        - bergen-ai-catalog.timer

    - name: Start only the separately approved timer
      ansible.builtin.systemd:
        name: bergen-ai-catalog.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify scheduled service is enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, bergen-ai-catalog.timer]
      register: bp_ai_timer_enabled
      changed_when: false

    - name: Require timer enabled
      ansible.builtin.assert:
        that:
          - bp_ai_timer_enabled.stdout | trim == 'enabled'

    - name: Report only non-identifying deployment categories
      ansible.builtin.debug:
        msg:
          - TIMER=ENABLED
          - SCOPE=ONLY_NEW_POST_WATERMARK_ELTERN_INBOX_DOCUMENTS
          - METADATA=TITLE_CORRESPONDENT_TAGS_DOCUMENT_TYPE
          - NOTES=ENABLED_FOR_VALIDATED_CLASSIFICATION_ONLY
          - FAILURE=PRIVATE_JOURNAL_ONLY_NO_RETRY
          - INBOX_TAG_REMOVAL=NEVER
          - DOCUMENT_PERMISSIONS=UNCHANGED
          - AMBIGUOUS_DOCUMENT_RETRIES=MANUAL_REVIEW_ONLY
