---
# Narrow DNF journal classification only after independent, same-run CT790
# one-failed-unit proof. Zero guest/host writes, no service changes or shutdown.
- import_playbook: diagnose-rocky-9-8-ct790-failed-unit-readonly.yml

- name: Classify only CT790 failed dnf-makecache journal without raw disclosure
  hosts: venombox
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require exact same-run failed DNF unit and isolated RUNNING CT790
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - rocky_running_host.stdout == 'venombox'
          - rocky_failed_unit_name == 'dnf-makecache.service'
          - rocky_failed_unit_fields.ActiveState == 'failed'
          - rocky_failed_unit_fields.Result == 'exit-code'
          - rocky_failed_unit_fields.ExecMainStatus == '1'
          - rocky_running_systemd.stdout | trim == 'degraded'
          - "'status: running' in rocky_failed_unit_final_status.stdout_lines"
          - "'NON_LOOPBACK_DEVICES=0' in rocky_running_guest.stdout_lines"
          - "'GUEST_IDMAP_NONIDENTITY=YES' in rocky_running_guest.stdout_lines"
          - "'hostname: nextcloud-restore-701' in rocky_running_ct701.stdout_lines"
        fail_msg: Exact degraded DNF unit and CT790 isolation proof missing; do not execute any journal command.

    - name: Read only bounded time-window DNF unit journal on running CT790
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '790'
          - --
          - journalctl
          - --utc
          - --no-pager
          - --output=cat
          - --unit=dnf-makecache.service
          - --since
          - '2026-10-22 05:00:00'
          - --until
          - '2026-10-22 05:40:00'
          - -n
          - '80'
      register: rocky_dnf_journal
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail closed if scoped journal could not be read or was unbounded
      ansible.builtin.assert:
        that:
          - rocky_dnf_journal.rc == 0
          - rocky_dnf_journal.stdout | length <= 32768
          - rocky_dnf_journal.stdout_lines | length <= 80
        fail_msg: Journal unreadable or unbounded; do not expose raw log text or modify CT790.

    - name: Classify journal failure patterns only in protected host/controller memory
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/nextcloud/classify_ct790_dnf_makecache_journal.py') }}"
        stdin: "{{ rocky_dnf_journal.stdout }}"
        stdin_add_newline: false
      register: rocky_dnf_category
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require enumerated nonsecret journal classification only
      ansible.builtin.assert:
        that:
          - rocky_dnf_category.rc == 0
          - (rocky_dnf_category.stdout | from_json).result == 'ROCKY_9_8_CT790_DNF_JOURNAL_CLASSIFIED_READ_ONLY'
          - >-
            (rocky_dnf_category.stdout | from_json).category in
            ['DNS_RESOLUTION_ERROR_OBSERVED',
             'NETWORK_CONNECTION_ERROR_OBSERVED',
             'REPOSITORY_CONFIG_ERROR_OBSERVED',
             'REPOSITORY_METADATA_ERROR_OBSERVED_CAUSE_UNDETERMINED',
             'NO_RECOGNIZED_CAUSE_IN_BOUNDED_JOURNAL']
          - (rocky_dnf_category.stdout | from_json).bounded_journal_lines | int <= 80
          - not (rocky_dnf_category.stdout | from_json).raw_content_disclosed
          - (rocky_dnf_category.stdout | from_json).files_written == 0
          - (rocky_dnf_category.stdout | from_json).services_changed == 0
          - not (rocky_dnf_category.stdout | from_json).guest_started_or_stopped
        fail_msg: Untrusted log data did not yield safe bounded classification.

    - name: Verify CT790 remains running after journal diagnosis
      ansible.builtin.command:
        argv: [pct, status, '790']
      changed_when: false
      register: rocky_dnf_final_status

    - name: Refuse unexpected guest shutdown or startup
      ansible.builtin.assert:
        that:
          - "'status: running' in rocky_dnf_final_status.stdout_lines"

    - name: Report sanitized journal findings without any repository details
      ansible.builtin.debug:
        msg:
          result: ROCKY_9_8_CT790_DNF_JOURNAL_CLASSIFIED_READ_ONLY
          vmid: 790
          failed_unit: dnf-makecache.service
          systemd_state: degraded
          failure_time_utc: '2026-10-22 05:32:41'
          category: "{{ (rocky_dnf_category.stdout | from_json).category }}"
          bounded_journal_lines: "{{ (rocky_dnf_category.stdout | from_json).bounded_journal_lines }}"
          dns_error_observed: "{{ (rocky_dnf_category.stdout | from_json).dns_error_observed }}"
          network_error_observed: "{{ (rocky_dnf_category.stdout | from_json).network_error_observed }}"
          repo_metadata_error_observed: "{{ (rocky_dnf_category.stdout | from_json).repo_metadata_error_observed }}"
          repo_config_error_observed: "{{ (rocky_dnf_category.stdout | from_json).repo_config_error_observed }}"
          raw_repository_urls_disclosed: false
          files_written: 0
          ct790_status: RUNNING
          network_interfaces_beyond_loopback: 0
          ct701_unchanged: true
          pct_shutdown_authorized: false
          pct_stop_authorized: false
          pct_template_authorized: false
          next_gate: Review observed category and decide whether offline DNF timer policy or separately approved graceful shutdown should change.
