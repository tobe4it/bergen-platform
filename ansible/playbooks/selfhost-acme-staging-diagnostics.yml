---
# Read-only diagnosis of a failed isolated selfHOST ACME staging issuance.
# Real host identity, DNS zone and record IDs are passed from Git-ignored YAML.
# Does not change DNS, hook state, or Certbot certificate lineages.

- name: Identify the approved certificate source for diagnostics
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require local source SSH identity and DNS probe configuration
      ansible.builtin.assert:
        that:
          - mail_tls_source_address is defined
          - mail_tls_source_ssh_user is defined
          - selfhost_acme_zone is defined
          - selfhost_acme_nameservers is defined
          - selfhost_acme_nameservers | length >= 2
          - selfhost_acme_record_ids is defined
          - selfhost_acme_record_ids | length == 2
        fail_msg: Missing local source or DNS data
      no_log: true

    - name: Register only the configured certificate source
      ansible.builtin.add_host:
        name: selfhost-acme-diagnostic-source
        groups: selfhost_acme_diagnostic_sources
        ansible_host: "{{ mail_tls_source_address }}"
        ansible_user: "{{ mail_tls_source_ssh_user }}"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

- name: Diagnose staging certificate attempt without changing any state
  hosts: selfhost_acme_diagnostic_sources
  become: true
  gather_facts: false
  vars:
    selfhost_acme_state_file: /var/lib/selfhost-acme/active.json
    selfhost_acme_staging_log: /var/lib/acme-staging/log/letsencrypt.log
  tasks:
    - name: Check whether the hook reserved any TXT slots
      ansible.builtin.stat:
        path: "{{ selfhost_acme_state_file }}"
      register: selfhost_acme_state_stat

    - name: Read hook state without exposing challenge values
      ansible.builtin.slurp:
        src: "{{ selfhost_acme_state_file }}"
      register: selfhost_acme_state_raw
      when: selfhost_acme_state_stat.stat.exists
      no_log: true

    - name: Parse private state locally without logging contents
      ansible.builtin.set_fact:
        selfhost_acme_safe_state: "{{ (selfhost_acme_state_raw.content | b64decode | from_json) if selfhost_acme_state_stat.stat.exists else {} }}"
      no_log: true

    - name: Print only slot IDs and state labels, never validation values
      ansible.builtin.debug:
        msg:
          slot: "{{ item.key }}"
          status: "{{ item.value.status | default('UNKNOWN') }}"
      loop: "{{ selfhost_acme_safe_state | dict2items }}"
      loop_control:
        label: "reserved-slot-{{ item.key }}"
      when: selfhost_acme_safe_state | length > 0

    - name: Report no active local reservations
      ansible.builtin.debug:
        msg: "No active ACME hook reservations"
      when: selfhost_acme_safe_state | length == 0

    - name: Query current public TXT records on each authoritative server
      ansible.builtin.command:
        argv:
          - dig
          - +short
          - +norecurse
          - +time=3
          - +tries=1
          - TXT
          - "_acme-challenge.{{ selfhost_acme_zone }}"
          - "@{{ item }}"
      changed_when: false
      register: selfhost_acme_dns_results
      loop: "{{ selfhost_acme_nameservers }}"

    - name: Summarize whether each TXT slot is idle (no challenge tokens)
      ansible.builtin.debug:
        msg:
          nameserver: "{{ item.item }}"
          slot_1_idle: "{{ ('selfhost-api-idle-' ~ (selfhost_acme_record_ids[0] | string)) in item.stdout }}"
          slot_2_idle: "{{ ('selfhost-api-idle-' ~ (selfhost_acme_record_ids[1] | string)) in item.stdout }}"
          dns_lookup_rc: "{{ item.rc }}"
      loop: "{{ selfhost_acme_dns_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Classify staging log errors without printing log text or credentials
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path
            import re
            log = Path("/var/lib/acme-staging/log/letsencrypt.log")
            if not log.exists():
                print("staging_log_present=false")
                raise SystemExit(0)
            data = log.read_text(encoding="utf-8", errors="replace").splitlines()
            print("staging_log_present=true")
            patterns = [
                ("api_http_401", r"(?:http|status)\s*401"),
                ("api_http_403", r"(?:http|status)\s*403"),
                ("api_http_409", r"(?:http|status)\s*409"),
                ("api_http_429", r"(?:http|status)\s*429"),
                ("api_http_503", r"(?:http|status)\s*503"),
                ("dns_propagation_timeout", r"DNS propagation not confirmed"),
                ("hook_root_permission", r"must be executed as root|must be owned by root"),
                ("hook_state_mismatch", r"Cleanup does not match|Both TXT slots are occupied"),
                ("missing_hook_dependency", r"No such file or directory|ModuleNotFoundError|not found"),
                ("ca_dns_error", r"NXDOMAIN|SERVFAIL|DNS problem"),
                ("ca_challenge_rejected", r"unauthorized|challenge failed|Invalid response"),
                ("network_timeout", r"timed out|connection (?:error|refused)"),
                ("hook_execution_error", r"Error running (?:authenticator|manual-auth-hook|manual-cleanup-hook)|hook failed"),
            ]
            detected = sorted({label for label, expression in patterns
                               if any(re.search(expression, line, re.I) for line in data)})
            print("diagnostic_classes=" + (",".join(detected) if detected else "none_of_known_classes"))
            interesting = [n for n, line in enumerate(data, 1)
                           if re.search(r"ERROR|Traceback|HookError|error running|DNS propagation|HTTP 4\d\d|HTTP 5\d\d", line, re.I)]
            print("diagnostic_line_count=" + str(len(interesting)))
            print("last_diagnostic_line_numbers=" + ",".join(map(str, interesting[-8:])))
      changed_when: false
      register: selfhost_acme_log_summary

    - name: Show sanitized staging log classification
      ansible.builtin.debug:
        var: selfhost_acme_log_summary.stdout_lines

    - name: Extract exact known staging hook failure categories without showing log text
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            from pathlib import Path
            import re
            path = Path("/var/lib/acme-staging/log/letsencrypt.log")
            if not path.is_file():
                print("log_not_found")
                raise SystemExit(0)
            lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
            known = (
                ("selfhost_http_rejected", r"selfHOST API rejected (?:present|cleanup) with HTTP ([1-5][0-9][0-9])"),
                ("selfhost_transport_uncertain", r"selfHOST API request failed; remote slot state uncertain"),
                ("selfhost_unexpected_http_status", r"selfHOST did not acknowledge the change"),
                ("api_key_validation_error", r"Missing or invalid API key format"),
                ("config_invalid", r"Missing or unsafe local configuration|Invalid local configuration|Invalid zone"),
                ("slot_already_reserved", r"Both TXT slots are occupied|Challenge already reserved"),
                ("root_permission_error", r"must be executed as root|must be owned by root"),
                ("dns_propagation_failure", r"DNS propagation not confirmed"),
                ("unapproved_certbot_domain", r"Certbot requested an unapproved domain"),
                ("invalid_certbot_validation", r"Certbot DNS-01 validation value malformed"),
                ("hook_state_error", r"Cleanup does not match|Challenge was not confirmed presented"),
                ("unexpected_python_exception", r"Traceback \(most recent call last\)|Exception occurred"),
                ("certbot_acme_rejection", r"urn:ietf:params:acme:error:|challenge failed|unauthorized"),
            )
            matches = []
            for label, pattern in known:
                found = [re.search(pattern, line, re.I) for line in lines]
                found = [m for m in found if m]
                if found:
                    details = ""
                    if label == "selfhost_http_rejected":
                        details = "_HTTP_" + found[-1].group(1)
                    matches.append(label + details)
            print("known_failure_categories=" + (",".join(matches) if matches else "none_matched"))
            print("certbot_log_lines=" + str(len(lines)))
      changed_when: false
      register: selfhost_acme_exact_failure

    - name: Show allowlisted hook failure types, never raw log lines
      ansible.builtin.debug:
        var: selfhost_acme_exact_failure.stdout_lines

    - name: Test MX2 direct DNS, TLS and read-only HTTPS reachability to selfHOST
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import socket
            import ssl
            import urllib.error
            import urllib.request

            host = "my.selfhost.de"
            url = "https://my.selfhost.de/cgi-bin/dns-api.pl"

            def classify(exc):
                if isinstance(exc, socket.gaierror):
                    return "dns_resolution_error"
                if isinstance(exc, ssl.SSLCertVerificationError):
                    return "tls_certificate_validation_error"
                if isinstance(exc, ssl.SSLError):
                    return "tls_handshake_error"
                if isinstance(exc, (TimeoutError, socket.timeout)):
                    return "timeout"
                if isinstance(exc, ConnectionRefusedError):
                    return "tcp_connection_refused"
                if isinstance(exc, ConnectionResetError):
                    return "tcp_connection_reset"
                if isinstance(exc, OSError):
                    return "os_error_" + str(exc.errno)
                return type(exc).__name__

            try:
                addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
                print("dns_resolution=ok" if addresses else "dns_resolution=empty")
            except (OSError, ValueError) as exc:
                print("dns_resolution=" + classify(exc))

            print("https_proxy_configured=" + str(bool(
                urllib.request.getproxies().get("https"))).lower())
            try:
                with socket.create_connection((host, 443), timeout=8) as sock:
                    with ssl.create_default_context().wrap_socket(sock, server_hostname=host):
                        print("direct_tcp_tls=ok")
            except (OSError, ValueError) as exc:
                print("direct_tcp_tls=" + classify(exc))

            # GET is intentionally read-only. A 4xx/405 status still proves an
            # HTTP response was received. Never send an API key or TXT value.
            opener = urllib.request.build_opener()
            request = urllib.request.Request(url, method="GET")
            try:
                with opener.open(request, timeout=12) as response:
                    print("api_get_http_status=" + str(response.status))
            except urllib.error.HTTPError as exc:
                print("api_get_http_status=" + str(exc.code))
            except urllib.error.URLError as exc:
                print("api_get_transport_error=" + classify(exc.reason))
            except (OSError, ValueError) as exc:
                print("api_get_error=" + classify(exc))
      register: selfhost_acme_network_probe
      changed_when: false
      no_log: true

    - name: Show only predefined transport classifications
      ansible.builtin.debug:
        var: selfhost_acme_network_probe.stdout_lines

    - name: Clarify that diagnosis never changes production or DNS
      ansible.builtin.debug:
        msg: "DIAGNOSTICS_ONLY: no TXT updates, no Certbot issuance, no production certificate changes."
