---
# No controller -> Paperless SSH; all access goes through venombox / pct.
# No --commit, no timer, no watcher.
- name: Prepare Paperless ingest reconciliation through Proxmox
  hosts: venombox
  gather_facts: false
  become: true

  vars:
    paperless_reconcile_vmid: "126"
    paperless_reconcile_target: /usr/local/libexec/bergen-paperless-reconcile-ingest.py

  tasks:
    - name: Require known Proxmox host and real execution
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - not ansible_check_mode

    - name: Inspect Paperless guest configuration
      ansible.builtin.command:
        argv: [pct, config, "{{ paperless_reconcile_vmid }}"]
      register: paperless_reconcile_config
      changed_when: false

    - name: Verify expected confined Paperless guest
      ansible.builtin.assert:
        that:
          - "'hostname: bergen-paperless' in paperless_reconcile_config.stdout_lines"
          - "'unprivileged: 1' in paperless_reconcile_config.stdout_lines"
          - "'lxc.apparmor.profile: unconfined' not in paperless_reconcile_config.stdout"

    - name: Verify running guest
      ansible.builtin.command:
        argv: [pct, status, "{{ paperless_reconcile_vmid }}"]
      register: paperless_reconcile_status
      changed_when: false
      failed_when: >-
        paperless_reconcile_status.rc != 0 or
        (paperless_reconcile_status.stdout | trim) != 'status: running'

    - name: Verify guest hostname
      ansible.builtin.command:
        argv: [pct, exec, "{{ paperless_reconcile_vmid }}", --, hostname, -s]
      register: paperless_reconcile_hostname
      changed_when: false
      failed_when: >-
        paperless_reconcile_hostname.rc != 0 or
        (paperless_reconcile_hostname.stdout | trim) != 'bergen-paperless'

    - name: Verify safe guest installation directory and target
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ paperless_reconcile_vmid }}"
          - --
          - python3
          - -c
          - |
            from pathlib import Path
            import stat
            parent = Path('/usr/local/libexec')
            target = parent / 'bergen-paperless-reconcile-ingest.py'
            s = parent.lstat()
            assert stat.S_ISDIR(s.st_mode) and s.st_uid == 0 and stat.S_IMODE(s.st_mode) == 0o755
            if target.is_symlink():
                raise RuntimeError('Unsafe symlink at reconciliation target')
            if target.exists():
                s = target.lstat()
                assert stat.S_ISREG(s.st_mode) and s.st_uid == 0 and s.st_nlink == 1
      changed_when: false

    - name: Transfer, install and dry-run reconciler
      block:
        - name: Allocate temporary host file
          ansible.builtin.tempfile:
            state: file
            path: /var/tmp
            prefix: bergen-paperless-reconcile-
            suffix: .py
          register: reconcile_host_tmp

        - name: Copy reviewed reconciler to temporary host file
          ansible.builtin.copy:
            src: ../files/paperless/reconcile_ingest.py
            dest: "{{ reconcile_host_tmp.path }}"
            owner: root
            group: root
            mode: '0600'

        - name: Hash reviewed code on venombox
          ansible.builtin.stat:
            path: "{{ reconcile_host_tmp.path }}"
            checksum_algorithm: sha256
          register: reconcile_expected_hash

        - name: Allocate guest temporary directory
          ansible.builtin.command:
            argv: [pct, exec, "{{ paperless_reconcile_vmid }}", --, mktemp, -d, /var/tmp/bergen-paperless-reconcile.XXXXXXXX]
          register: reconcile_guest_tmp
          changed_when: true

        - name: Validate guest temporary directory path
          ansible.builtin.assert:
            that:
              - reconcile_guest_tmp.stdout | trim is match('^/var/tmp/bergen-paperless-reconcile\\.[A-Za-z0-9]{8}$')

        - name: Copy code through Proxmox
          ansible.builtin.command:
            argv:
              - pct
              - push
              - "{{ paperless_reconcile_vmid }}"
              - "{{ reconcile_host_tmp.path }}"
              - "{{ reconcile_guest_tmp.stdout | trim }}/reconcile_ingest.py"

        - name: Hash code inside guest
          ansible.builtin.command:
            argv:
              - pct
              - exec
              - "{{ paperless_reconcile_vmid }}"
              - --
              - sha256sum
              - "{{ reconcile_guest_tmp.stdout | trim }}/reconcile_ingest.py"
          register: reconcile_guest_hash
          changed_when: false

        - name: Require identical transferred bytes
          ansible.builtin.assert:
            that:
              - reconcile_guest_hash.stdout.split()[0] == reconcile_expected_hash.stat.checksum

        - name: Check existing deployed code checksum
          ansible.builtin.command:
            argv: [pct, exec, "{{ paperless_reconcile_vmid }}", --, sha256sum, "{{ paperless_reconcile_target }}"]
          register: reconcile_installed_hash
          changed_when: false
          failed_when: false

        - name: Install reconciler only when content differs
          ansible.builtin.command:
            argv:
              - pct
              - exec
              - "{{ paperless_reconcile_vmid }}"
              - --
              - install
              - -o
              - root
              - -g
              - root
              - -m
              - '0750'
              - "{{ reconcile_guest_tmp.stdout | trim }}/reconcile_ingest.py"
              - "{{ paperless_reconcile_target }}"
          when: >-
            reconcile_installed_hash.rc != 0 or
            reconcile_installed_hash.stdout.split()[0] != reconcile_expected_hash.stat.checksum

        - name: Verify receipts read-only (no acknowledgement commit)
          ansible.builtin.command:
            argv: [pct, exec, "{{ paperless_reconcile_vmid }}", --, python3, "{{ paperless_reconcile_target }}"]
          register: reconcile_dryrun
          changed_when: false

        - name: Display receipt verification result
          ansible.builtin.debug:
            var: reconcile_dryrun.stdout_lines

      always:
        - name: Remove temporary guest directory
          ansible.builtin.command:
            argv:
              - pct
              - exec
              - "{{ paperless_reconcile_vmid }}"
              - --
              - rm
              - -r
              - --
              - "{{ reconcile_guest_tmp.stdout | trim }}"
          when:
            - reconcile_guest_tmp is defined
            - reconcile_guest_tmp.stdout is defined
            - reconcile_guest_tmp.stdout | trim is match('^/var/tmp/bergen-paperless-reconcile\\.[A-Za-z0-9]{8}$')
          changed_when: false

        - name: Remove temporary Proxmox file
          ansible.builtin.file:
            path: "{{ reconcile_host_tmp.path }}"
            state: absent
          when:
            - reconcile_host_tmp is defined
            - reconcile_host_tmp.path is defined
            - reconcile_host_tmp.path is match('^/var/tmp/bergen-paperless-reconcile-[^/]+\\.py$')
          changed_when: false
