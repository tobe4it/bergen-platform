---
# The native AI UI switch is global, not a per-parent-user toggle.
# No embedding indexing, document write, workflow or daemon/timer activation.
- name: Audit and explicitly enable the native Paperless AI suggestions interface
  hosts: venombox
  become: true
  gather_facts: false
  vars:
    bp_native_ui_mode: "{{ paperless_native_ai_ui_mode | default('audit') }}"
    bp_native_ui_payload:
      protocol: native-ai-ui-v1
      mode: "{{ bp_native_ui_mode }}"
      approved: "{{ paperless_native_ai_ui_approved | default(false) | bool }}"
      backup_verified: "{{ paperless_ai_catalog_verified_backup | default(false) | bool }}"
      expected_model: "{{ paperless_ai_catalog_model | default('') }}"
      expected_endpoint: "{{ paperless_ai_catalog_endpoint | default('') }}"
      expected_sha256: "{{ paperless_native_ai_ui_expected_sha256 | default('') }}"
  tasks:
    - name: Require read-only default and independent global AI interface approval
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'venombox'
          - bp_native_ui_mode in ['audit', 'apply']
          - not ansible_check_mode or bp_native_ui_mode == 'audit'
          - bp_native_ui_mode == 'audit' or (paperless_native_ai_ui_approved | default(false) | bool)
          - bp_native_ui_mode == 'audit' or (paperless_ai_catalog_verified_backup | default(false) | bool)
          - bp_native_ui_mode == 'audit' or (paperless_native_ai_ui_expected_sha256 | default('') | length == 64)
        fail_msg: NATIVE_AI_UI_APPROVAL_REQUIRED
      no_log: true

    - name: Verify only expected Paperless guest
      ansible.builtin.command:
        argv: [pct, config, '126']
      register: bp_native_ui_guest
      changed_when: false
      no_log: true

    - name: Reject unexpected or privileged container
      ansible.builtin.assert:
        that:
          - bp_native_ui_guest.rc == 0
          - "'hostname: bergen-paperless' in bp_native_ui_guest.stdout_lines"
          - "'unprivileged: 1' in bp_native_ui_guest.stdout_lines"
          - "'lxc.apparmor.profile: unconfined' not in bp_native_ui_guest.stdout"
      no_log: true

    - name: Audit or enable Paperless's native AI UI without modifying Ollama backend
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - '126'
          - --
          - podman
          - exec
          - -i
          - bergen-paperless
          - python
          - /usr/src/paperless/src/manage.py
          - shell
          - --verbosity=0
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/paperless/bergen_ai_catalog_native_ui.py', rstrip=False) }}"
        stdin: "{{ bp_native_ui_payload | to_json }}"
        stdin_add_newline: true
      register: bp_native_ui_raw
      changed_when: false
      failed_when: false
      no_log: true

    - name: Extract exactly one sanitized configuration frame
      ansible.builtin.set_fact:
        bp_native_ui_frames: >-
          {{ bp_native_ui_raw.stdout_lines | default([]) |
             select('match', '^BERGEN_PAPERLESS_NATIVE_AI_UI_V1:') | list }}
      no_log: true

    - name: Refuse missing or ambiguous AI UI evidence
      ansible.builtin.assert:
        that:
          - bp_native_ui_frames | length == 1
          - bp_native_ui_frames[0] | length < 1200
        fail_msg: NATIVE_AI_UI_FRAME_UNVERIFIED
      no_log: true

    - name: Decode only allowlisted AI UI status
      ansible.builtin.set_fact:
        bp_native_ui_result: >-
          {{ bp_native_ui_frames[0] |
             regex_replace('^BERGEN_PAPERLESS_NATIVE_AI_UI_V1:', '') | from_json }}
      no_log: true

    - name: Refuse any unexpected global settings drift
      ansible.builtin.assert:
        that:
          - bp_native_ui_raw.rc == 0
          - bp_native_ui_result.AUDIT in ['READ_ONLY', 'CONTROLLED']
          - bp_native_ui_result.STATUS == ('NATIVE_AI_UI_ENABLED' if bp_native_ui_mode == 'apply' else 'INSPECTED')
          - bp_native_ui_result.EMBEDDINGS == 'OFF'
          - bp_native_ui_result.CHANGED is boolean
          - bp_native_ui_mode == 'apply' or not bp_native_ui_result.CHANGED
        fail_msg: NATIVE_AI_UI_NOT_VERIFIED
      no_log: true

    - name: Display AI UI scope and audit fingerprint without secrets
      ansible.builtin.debug:
        msg:
          - "AUDIT={{ bp_native_ui_result.AUDIT }}"
          - "STATUS={{ bp_native_ui_result.STATUS }}"
          - "AI_UI_ENABLED={{ bp_native_ui_result.AI_UI_ENABLED }}"
          - "EMBEDDINGS={{ bp_native_ui_result.EMBEDDINGS }}"
          - "CURRENT_SHA256={{ bp_native_ui_result.CURRENT_SHA256 | default('N/A') }}"
          - "CHANGED={{ bp_native_ui_result.CHANGED }}"
      changed_when: bp_native_ui_mode == 'apply' and bp_native_ui_result.CHANGED | bool
