---
# Separate, reviewed change window. Never called by the certificate preparation.
- name: Activate already prepared MQ transport identities with controlled restart
  hosts: bergen-mq-lab:bergen-mq-lab-b
  become: true
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    mq_lab_transport_pki_enabled: true
    mq_lab_qmgr: "{{ 'BERGENLAB' if inventory_hostname == 'bergen-mq-lab' else 'BERGENLABB' }}"
  tasks:
    - name: Require explicitly approved service restart
      ansible.builtin.assert:
        that:
          - mq_transport_pki_activate | default(false) | bool
          - mq_transport_restart_approved | default(false) | bool
          - inventory_hostname in ['bergen-mq-lab', 'bergen-mq-lab-b']
          - ansible_facts.distribution == 'Rocky'
        fail_msg: "No transport activation without explicit PKI and restart approval."

    - name: Inspect existing production-of-lab Quadlet without editing
      ansible.builtin.slurp:
        src: /etc/containers/systemd/bergen-mq-lab.container
      register: transport_original_quadlet

    - name: Extract existing pinned image without using a new image version
      ansible.builtin.set_fact:
        mq_lab_image: >-
          {{ (transport_original_quadlet.content | b64decode |
              regex_findall('(?m)^Image=(\\S+)$')) | first | default('') }}

    - name: Refuse missing or unpinned existing image
      ansible.builtin.assert:
        that:
          - mq_lab_image is match('^icr[.]io/ibm-messaging/mq:9[.]4[.].*-amd64@sha256:[a-f0-9]{64}$')

    - name: Require existing base Quadlet to match repository-managed template
      ansible.builtin.assert:
        that:
          - >-
            (transport_original_quadlet.content | b64decode)
            == lookup('ansible.builtin.template',
              playbook_dir ~ '/../roles/mq_lab/templates/bergen-mq-lab.container.j2')
        fail_msg: >-
          Existing Quadlet differs from reviewed template; refuse changes.
          Review the actual diff before restarting.
      vars:
        mq_lab_transport_pki_enabled: false
      when: "'Volume=/etc/bergen-mq-lab/transport-pki/identity:' not in (transport_original_quadlet.content | b64decode)"

    - name: Check prepared key material exists before writing Quadlet
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/bergen-mq-lab/transport-pki/identity/tls.key
        - /etc/bergen-mq-lab/transport-pki/identity/tls.crt
        - /etc/bergen-mq-lab/transport-pki/identity/ca.crt
        - /etc/bergen-mq-lab/transport-pki/trust/tls.crt
      register: transport_pki_files

    - name: Refuse incomplete PKI material
      ansible.builtin.assert:
        that:
          - transport_pki_files.results | selectattr('stat.exists', 'equalto', false) | list | length == 0

    - name: Render reviewed Quadlet including exactly two transport mounts
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/mq_lab/templates/bergen-mq-lab.container.j2"
        dest: /etc/containers/systemd/bergen-mq-lab.container
        owner: root
        group: root
        mode: '0644'
      register: transport_quadlet_update

    - name: Reload Quadlet generator after approved definition change
      ansible.builtin.systemd_service:
        daemon_reload: true
      when:
        - transport_quadlet_update.changed
        - not ansible_check_mode

    - name: Restart ONLY approved evaluation service on changed Quadlet
      ansible.builtin.systemd_service:
        name: bergen-mq-lab.service
        state: restarted
      when:
        - transport_quadlet_update.changed
        - not ansible_check_mode

    - name: Wait for restarted web listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9443
        timeout: 180
      when: not ansible_check_mode

    - name: Confirm imported personal labels and separate peer CA
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - bergen-mq-lab
          - /opt/mqm/bin/runmqakm
          - -cert
          - -list
          - -db
          - /run/runmqserver/tls/key.kdb
          - -stashed
      environment:
        CONTAINERS_STORAGE_CONF: /etc/bergen-mq-lab/storage.conf
      register: transport_labels
      changed_when: false
      when: not ansible_check_mode

    - name: Require existing and newly imported identities
      ansible.builtin.assert:
        that:
          - "'bergenlab' in transport_labels.stdout"
          - "'bergentransport' in transport_labels.stdout"
          - "('Bergen MQ Transport CA ' ~ ('BERGENLABB' if inventory_hostname == 'bergen-mq-lab' else 'BERGENLAB')) in transport_labels.stdout"
        fail_msg: "New certificate import not confirmed. Review service logs and restore previous Quadlet via Ansible."
      when: not ansible_check_mode

    - name: Show evaluation PKI activation result
      ansible.builtin.debug:
        msg: "Transport PKI mounts {{ 'planned' if ansible_check_mode else 'verified' }} on {{ inventory_hostname }}; existing certificate label remains a separate check."
