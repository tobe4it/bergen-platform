---
# ONLY inventory already-attempted CT110 backup; this play never runs vzdump.
- name: Verify CT110 archive metadata after failed Ansible postcheck
  hosts: venombox
  become: true
  gather_facts: false
  tasks:
    - name: Require exact hypervisor
      ansible.builtin.assert:
        that:
          - "inventory_hostname == 'venombox'"

    - name: Collect CT110 state, NFS mount and archived volume metadata
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/bergen_ai/audit_ct110_postbackup_archive_readonly.py', rstrip=False) }}"
      register: ct110_postbackup_raw
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Extract exactly one bounded sanitized verification frame
      ansible.builtin.set_fact:
        ct110_postbackup_frames: >-
          {{ ct110_postbackup_raw.stdout_lines | default([]) |
             select('match', '^BERGEN_AI_CT110_POSTBACKUP_INVENTORY_V1:') | list }}
      no_log: true

    - name: Refuse failed oversized or duplicate verification frames
      ansible.builtin.assert:
        that:
          - "ct110_postbackup_raw.rc == 0"
          - "ct110_postbackup_frames | length == 1"
          - "ct110_postbackup_frames[0] | length < 1800"
      no_log: true

    - name: Decode sanitized archive categories only
      ansible.builtin.set_fact:
        ct110_postbackup: >-
          {{ (ct110_postbackup_frames[0] |
              regex_replace('^BERGEN_AI_CT110_POSTBACKUP_INVENTORY_V1:', '')) | from_json }}
      no_log: true

    - name: Refuse modifications, assertions of integrity, or network authorization
      ansible.builtin.assert:
        that:
          - "ct110_postbackup.AUDIT == 'READ_ONLY'"
          - "not ct110_postbackup.CHANGED"
          - "not ct110_postbackup.BACKUP_EXECUTED_BY_THIS_AUDIT"
          - "not ct110_postbackup.ARCHIVE_CONTENTS_CHECKED"
          - "not ct110_postbackup.APPLY_AUTHORIZED"
          - "ct110_postbackup.BACKUP_INTEGRITY == 'NOT_TESTED'"
          - "ct110_postbackup.RESTORE_TEST == 'NOT_ATTESTED'"
          - "ct110_postbackup.ROLLBACK_CLEARANCE == 'NOT_PROVEN'"
          - "ct110_postbackup.NETWORK_CHANGES == 'NONE'"
          - "ct110_postbackup.STATUS in ['ARCHIVE_PRESENT_NOT_VALIDATED', 'REVIEW_REQUIRED', 'UNVERIFIED']"
          - "ct110_postbackup.CT110_STATE in ['RUNNING', 'NOT_VERIFIED_RUNNING', 'UNVERIFIED']"
          - "ct110_postbackup.BACKUP_TARGET in ['EXPECTED_ACTIVE_NFS', 'UNVERIFIED', 'WRONG_OR_UNMOUNTED_TARGET', 'PVE_STORAGE_UNVERIFIED', 'BACKUP_CONTENT_UNVERIFIED']"
          - "ct110_postbackup.CT110_ARCHIVE_METADATA in ['ONE_NONEMPTY_ZSTD_ARCHIVE_VISIBLE', 'NONE', 'MULTIPLE', 'UNEXPECTED_FORMAT_OR_STORAGE', 'EMPTY_OR_UNKNOWN_SIZE', 'UNVERIFIED']"
      no_log: true

    - name: Report point-in-time archive inventory without backup execution
      ansible.builtin.debug:
        msg:
          - AUDIT=READ_ONLY
          - "STATUS={{ ct110_postbackup.STATUS }}"
          - "CT110_STATE={{ ct110_postbackup.CT110_STATE }}"
          - "BACKUP_TARGET={{ ct110_postbackup.BACKUP_TARGET }}"
          - "CT110_ARCHIVE_COUNT={{ ct110_postbackup.CT110_ARCHIVE_COUNT }}"
          - "CT110_ARCHIVE_METADATA={{ ct110_postbackup.CT110_ARCHIVE_METADATA }}"
          - BACKUP_EXECUTED_BY_THIS_AUDIT=False
          - ARCHIVE_CONTENTS_CHECKED=False
          - BACKUP_INTEGRITY=NOT_TESTED
          - RESTORE_TEST=NOT_ATTESTED
          - ROLLBACK_CLEARANCE=NOT_PROVEN
          - APPLY_AUTHORIZED=False
