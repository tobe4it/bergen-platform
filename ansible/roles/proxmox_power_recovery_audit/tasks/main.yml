---
- name: Require explicitly selected venombox inventory target
  ansible.builtin.assert:
    that:
      - power_recovery_target is defined
      - (power_recovery_target | default('')) == 'venombox'
      - inventory_hostname == 'venombox'
    fail_msg: "Select only venombox with -e power_recovery_target=venombox"

- name: Read actual host identity
  check_mode: false
  ansible.builtin.command:
    argv: [hostname, -s]
  register: power_recovery_hostname
  changed_when: false

- name: Refuse unexpected physical host
  ansible.builtin.assert:
    that:
      - power_recovery_hostname.stdout | trim == 'venombox'
    fail_msg: "The target reports a different hostname; refusing firmware inventory"

- name: Confirm Proxmox node
  check_mode: false
  ansible.builtin.command:
    argv: [pveversion]
  register: power_recovery_pveversion
  changed_when: false

- name: Read system manufacturer
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, system-manufacturer]
  register: power_recovery_manufacturer
  changed_when: false
  failed_when: false

- name: Read system model
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, system-product-name]
  register: power_recovery_model
  changed_when: false
  failed_when: false

- name: Read mainboard manufacturer
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, baseboard-manufacturer]
  register: power_recovery_board_vendor
  changed_when: false
  failed_when: false

- name: Read mainboard model
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, baseboard-product-name]
  register: power_recovery_board_model
  changed_when: false
  failed_when: false

- name: Read firmware vendor
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, bios-vendor]
  register: power_recovery_bios_vendor
  changed_when: false
  failed_when: false

- name: Read installed firmware version
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, bios-version]
  register: power_recovery_bios_version
  changed_when: false
  failed_when: false

- name: Read firmware release date
  check_mode: false
  ansible.builtin.command:
    argv: [dmidecode, -s, bios-release-date]
  register: power_recovery_bios_release_date
  changed_when: false
  failed_when: false

- name: Check for active UEFI boot environment
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: power_recovery_uefi

- name: Check for native local IPMI kernel interface
  ansible.builtin.stat:
    path: /sys/class/ipmi
  register: power_recovery_ipmi_kernel

- name: Check for local IPMI character device
  ansible.builtin.stat:
    path: /dev/ipmi0
  register: power_recovery_ipmi_device

- name: Check for firmware attributes interface
  ansible.builtin.stat:
    path: /sys/class/firmware-attributes
  register: power_recovery_firmware_attributes

- name: List exposed firmware setting value paths
  check_mode: false
  ansible.builtin.command:
    argv:
      - find
      - /sys/class/firmware-attributes
      - -maxdepth
      - "6"
      - -name
      - current_value
  register: power_recovery_firmware_paths
  changed_when: false
  failed_when: false
  when: power_recovery_firmware_attributes.stat.exists | default(false)

- name: Find fwupd BIOS configuration interface
  check_mode: false
  ansible.builtin.command:
    argv: [/bin/sh, -c, "command -v fwupdmgr"]
  register: power_recovery_fwupd_path
  changed_when: false
  failed_when: false

- name: Query BIOS settings exposed by fwupd
  check_mode: false
  ansible.builtin.command:
    argv:
      - "{{ power_recovery_fwupd_path.stdout | trim }}"
      - get-bios-settings
  register: power_recovery_fwupd_settings
  changed_when: false
  failed_when: false
  when: power_recovery_fwupd_path.rc == 0

- name: Find local IPMI command
  check_mode: false
  ansible.builtin.command:
    argv: [/bin/sh, -c, "command -v ipmitool"]
  register: power_recovery_ipmitool_path
  changed_when: false
  failed_when: false

- name: Query local IPMI chassis power policy
  check_mode: false
  ansible.builtin.command:
    argv:
      - "{{ power_recovery_ipmitool_path.stdout | trim }}"
      - -I
      - open
      - chassis
      - status
  register: power_recovery_ipmi_status
  changed_when: false
  failed_when: false
  when: power_recovery_ipmitool_path.rc == 0

- name: Query local IPMI power restore policy options
  check_mode: false
  ansible.builtin.command:
    argv:
      - "{{ power_recovery_ipmitool_path.stdout | trim }}"
      - -I
      - open
      - chassis
      - policy
      - list
  register: power_recovery_ipmi_policy
  changed_when: false
  failed_when: false
  when: power_recovery_ipmitool_path.rc == 0

- name: Find physical network devices for passive Wake-on-LAN inventory
  check_mode: false
  ansible.builtin.shell: |
    for netdev in /sys/class/net/*; do
      if test -d "$netdev/device"; then
        basename "$netdev"
      fi
    done
  args:
    executable: /bin/sh
  register: power_recovery_physical_interfaces
  changed_when: false

- name: Find preinstalled ethtool for Wake-on-LAN inventory
  check_mode: false
  ansible.builtin.command:
    argv: [/bin/sh, -c, "command -v ethtool"]
  register: power_recovery_ethtool_path
  changed_when: false
  failed_when: false

- name: Read Wake-on-LAN capability from physical NICs
  check_mode: false
  ansible.builtin.command:
    argv:
      - "{{ power_recovery_ethtool_path.stdout | trim }}"
      - "{{ item }}"
  loop: "{{ power_recovery_physical_interfaces.stdout_lines }}"
  register: power_recovery_nic_wol
  changed_when: false
  failed_when: false
  when: power_recovery_ethtool_path.rc == 0

- name: Build compact per-adapter Wake-on-LAN status
  ansible.builtin.set_fact:
    power_recovery_wol_summary: >-
      {{
        power_recovery_wol_summary | default({}) | combine({
          item.item: {
            'query_rc': item.rc | default(-1),
            'supported': (item.stdout | default('') | regex_findall('(?m)^[ \t]*Supports Wake-on:[ \t]*(\S+)') | first | default('UNKNOWN')),
            'enabled': (item.stdout | default('') | regex_findall('(?m)^[ \t]*Wake-on:[ \t]*(\S+)') | first | default('UNKNOWN')),
            'link': (item.stdout | default('') | regex_findall('(?m)^[ \t]*Link detected:[ \t]*(\S+)') | first | default('UNKNOWN'))
          }
        })
      }}
  loop: "{{ power_recovery_nic_wol.results | default([]) }}"
  when: item.rc is defined
  changed_when: false

- name: Read driver identity for wired host adapter
  check_mode: false
  ansible.builtin.command:
    argv:
      - "{{ power_recovery_ethtool_path.stdout | trim }}"
      - -i
      - "{{ item }}"
  loop: "{{ power_recovery_physical_interfaces.stdout_lines | select('match', '^en') | list }}"
  register: power_recovery_ethernet_drivers
  changed_when: false
  failed_when: false
  when: power_recovery_ethtool_path.rc == 0

- name: Summarize wired host adapter drivers
  ansible.builtin.debug:
    msg: >-
      {{ item.item }}:
      {{ item.stdout_lines | default([]) | select('match', '^(driver:|version:|bus-info:)') | list }}
  loop: "{{ power_recovery_ethernet_drivers.results | default([]) }}"
  when: not (item.skipped | default(false))

- name: Report supported remote-management surfaces without changing settings
  ansible.builtin.debug:
    msg:
      - "Proxmox node: {{ power_recovery_hostname.stdout | trim }} ({{ power_recovery_pveversion.stdout | trim }})"
      - "System: {{ power_recovery_manufacturer.stdout | default('unknown') | trim }} / {{ power_recovery_model.stdout | default('unknown') | trim }}"
      - "Mainboard: {{ power_recovery_board_vendor.stdout | default('unknown') | trim }} / {{ power_recovery_board_model.stdout | default('unknown') | trim }}"
      - "BIOS: {{ power_recovery_bios_vendor.stdout | default('unknown') | trim }} / {{ power_recovery_bios_version.stdout | default('unknown') | trim }} ({{ power_recovery_bios_release_date.stdout | default('unknown') | trim }})"
      - "UEFI boot: {{ power_recovery_uefi.stat.exists | default(false) }}"
      - "Local IPMI kernel interface: {{ power_recovery_ipmi_kernel.stat.exists | default(false) }}"
      - "Local IPMI character device: {{ power_recovery_ipmi_device.stat.exists | default(false) }}"
      - "Physical NIC interfaces (names only): {{ power_recovery_physical_interfaces.stdout_lines | default([]) }}"
      - "ethtool available: {{ power_recovery_ethtool_path.rc == 0 }}"
      - "Wake-on-LAN capabilities (supported/enabled/link by adapter): {{ power_recovery_wol_summary | default({}) }}"
      - "Firmware sysfs interface: {{ power_recovery_firmware_attributes.stat.exists | default(false) }}"
      - "Exposed current_value paths: {{ power_recovery_firmware_paths.stdout_lines | default([]) }}"
      - "fwupdmgr available: {{ power_recovery_fwupd_path.rc == 0 }} (query rc: {{ power_recovery_fwupd_settings.rc | default('not-run') }})"
      - "fwupd BIOS settings: {{ power_recovery_fwupd_settings.stdout_lines | default([]) }}"
      - "fwupd diagnostic: {{ power_recovery_fwupd_settings.stderr_lines | default([]) }}"
      - "ipmitool available: {{ power_recovery_ipmitool_path.rc == 0 }} (query rc: {{ power_recovery_ipmi_status.rc | default('not-run') }})"
      - "IPMI chassis status: {{ power_recovery_ipmi_status.stdout_lines | default([]) }}"
      - "IPMI restore policies: {{ power_recovery_ipmi_policy.stdout_lines | default([]) }}"
      - "IPMI diagnostic: {{ power_recovery_ipmi_status.stderr_lines | default([]) }}"
      - "No firmware setting, guest boot order, or host state was changed."
