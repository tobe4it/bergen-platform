---
daytrading_collector_user: daytrade
daytrading_collector_group: daytrade
daytrading_collector_base_dir: /opt/bergen/daytrading-collector
daytrading_collector_state_dir: /var/lib/bergen-daytrading
daytrading_collector_config: /etc/bergen-daytrading.json

daytrading_market_timezone: America/New_York
daytrading_timer_on_calendar: "Mon..Fri *-*-* 09:25:00 America/New_York"

daytrading_gap_min_pct: 2.0
daytrading_min_price_usd: 5.0
daytrading_min_premarket_volume: 100000
daytrading_min_relative_volume: 1.5
daytrading_candidate_limit: 25

daytrading_opening_range_start: "09:30:00"
daytrading_opening_range_end: "09:45:00"
daytrading_signal_window_end: "10:00:00"
daytrading_signal_poll_seconds: 10
daytrading_breakout_confirmations: 2

daytrading_tradingview_url: https://scanner.tradingview.com/america/scan
daytrading_yahoo_hosts:
  - query2.finance.yahoo.com
  - query1.finance.yahoo.com
daytrading_http_timeout_seconds: 12
daytrading_http_retries: 3

daytrading_allowed_exchanges:
  - NASDAQ
  - NYSE
  - AMEX
  - NYSEARCA

daytrading_email_enabled: false
daytrading_smtp_host: localhost
daytrading_smtp_port: 25
daytrading_smtp_starttls: false
daytrading_smtp_username: ""
daytrading_smtp_password: ""
daytrading_email_from: daytrading@localhost
daytrading_email_to: ""
