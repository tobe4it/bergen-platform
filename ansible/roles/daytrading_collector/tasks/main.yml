---
# Compliance cleanup: the former unlicensed market-data collector is no longer
# deployed. Historical output is intentionally preserved for local review.

- name: Stop and disable legacy daytrading timer
  ansible.builtin.systemd:
    name: bergen-daytrading-collector.timer
    enabled: false
    state: stopped
    daemon_reload: true
  failed_when: false

- name: Stop legacy daytrading service
  ansible.builtin.systemd:
    name: bergen-daytrading-collector.service
    state: stopped
  failed_when: false

- name: Remove legacy collector program, configuration and units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ daytrading_collector_base_dir }}/collector.py"
    - "{{ daytrading_collector_config }}"
    - /etc/systemd/system/bergen-daytrading-collector.service
    - /etc/systemd/system/bergen-daytrading-collector.timer

- name: Reload systemd after collector removal
  ansible.builtin.systemd:
    daemon_reload: true

- name: Report preserved collector state
  ansible.builtin.debug:
    msg: >-
      The legacy collector has been removed and disabled. Existing local output
      below {{ daytrading_collector_state_dir }} was preserved.
