---
# This role is an opt-in deployment only. No site-specific credentials in Git.
paperless_deployment_approved: false
paperless_start_approved: false
paperless_service_root: /srv/bergen-paperless
paperless_config_dir: /etc/bergen-paperless
paperless_quadlet_dir: /etc/containers/systemd
paperless_listen_address: 127.0.0.1
paperless_listen_port: 8000
paperless_timezone: Europe/Berlin
paperless_ocr_language: deu+eng
paperless_uid: 1000
paperless_gid: 1000
paperless_postgres_uid: 999
paperless_redis_uid: 999

# Stage 0: Synology SSO OIDC remains opt-in. No automatic signup or group sync.
# The exact Well-known URL must be copied from DSM SSO Server > Dienst > OIDC.
paperless_synology_oidc_enabled: false
paperless_synology_oidc_discovery_url: ''

# Stage 1: ASN labels only. Filesystem ingestion remains non-recursive.
# No NAS mount, import service, or ACL workflow is activated by these flags.
paperless_scan_asn_enabled: false
