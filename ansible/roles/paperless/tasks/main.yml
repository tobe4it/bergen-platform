---
- name: Reject deployment without explicit site-reviewed authorization
  ansible.builtin.assert:
    that:
      - paperless_deployment_approved | bool
      - paperless_image is defined
      - paperless_postgres_image is defined
      - paperless_redis_image is defined
      - paperless_url is defined
      - vault_paperless_secret_key is defined
      - vault_paperless_db_password is defined
      - paperless_admin_user is defined
      - vault_paperless_admin_password is defined
      - paperless_listen_address == '127.0.0.1'
      - paperless_listen_port | int == 8000
      - paperless_image is match('^ghcr[.]io/paperless-ngx/paperless-ngx:[A-Za-z0-9][A-Za-z0-9._-]+$')
      - paperless_postgres_image is match('^docker[.]io/library/postgres:[A-Za-z0-9][A-Za-z0-9._-]+$')
      - paperless_redis_image is match('^docker[.]io/library/redis:[A-Za-z0-9][A-Za-z0-9._-]+$')
      - "'latest' not in [paperless_image.split(':')[-1], paperless_postgres_image.split(':')[-1], paperless_redis_image.split(':')[-1]]"
      - "'REPLACE' not in paperless_image"
      - "'REPLACE' not in paperless_postgres_image"
      - "'REPLACE' not in paperless_redis_image"
      - "paperless_postgres_image.split(':')[-1] is match('^17[.][0-9]+([.-][A-Za-z0-9_-]+)?$')"
      - paperless_url is match('^https://[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+$')
      - vault_paperless_secret_key | length >= 50
      - vault_paperless_db_password | length >= 24
      - vault_paperless_admin_password | length >= 16
      - paperless_admin_user is match('^[A-Za-z0-9_][A-Za-z0-9_-]{1,31}$')
    fail_msg: >-
      Refusing Paperless deployment: set explicit approvals, immutable-reviewed
      image tags, HTTPS hostname and site-local strong credentials. Initial
      backend binding is loopback-only; WAN/LAN access is not enabled.
  no_log: true

- name: Read dedicated Paperless ZFS document mount
  ansible.builtin.command:
    argv:
      - findmnt
      - --mountpoint
      - "{{ paperless_service_root }}"
      - --noheadings
      - --output
      - TARGET,FSTYPE
  register: paperless_document_mount
  changed_when: false
  check_mode: false

- name: Require active dedicated ZFS volume before writing application data
  ansible.builtin.assert:
    that:
      - paperless_service_root == '/srv/bergen-paperless'
      - paperless_document_mount.stdout.split() | length == 2
      - paperless_document_mount.stdout.split()[0] == paperless_service_root
      - paperless_document_mount.stdout.split()[1] == 'zfs'
    fail_msg: >-
      Refusing Paperless deployment: /srv/bergen-paperless must be the
      dedicated mounted ZFS filesystem, not a directory on the guest rootfs.

- name: Install Podman and host dependencies
  ansible.builtin.apt:
    name:
      - podman
      - uidmap
      - fuse-overlayfs
      - slirp4netns
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create protected service and persistent application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.gid }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ paperless_service_root }}", uid: root, gid: root, mode: '0755' }
    - { path: "{{ paperless_service_root }}/postgres", uid: "{{ paperless_postgres_uid }}", gid: "{{ paperless_postgres_uid }}", mode: '0700' }
    - { path: "{{ paperless_service_root }}/redis", uid: "{{ paperless_redis_uid }}", gid: "{{ paperless_redis_uid }}", mode: '0700' }
    - { path: "{{ paperless_service_root }}/data", uid: "{{ paperless_uid }}", gid: "{{ paperless_gid }}", mode: '0750' }
    - { path: "{{ paperless_service_root }}/media", uid: "{{ paperless_uid }}", gid: "{{ paperless_gid }}", mode: '0750' }
    - { path: "{{ paperless_service_root }}/consume", uid: "{{ paperless_uid }}", gid: "{{ paperless_gid }}", mode: '0750' }
    - { path: "{{ paperless_service_root }}/export", uid: "{{ paperless_uid }}", gid: "{{ paperless_gid }}", mode: '0750' }
    - { path: "{{ paperless_config_dir }}", uid: root, gid: root, mode: '0700' }
    - { path: "{{ paperless_quadlet_dir }}", uid: root, gid: root, mode: '0755' }

- name: Render protected Paperless environment
  ansible.builtin.template:
    src: paperless.env.j2
    dest: "{{ paperless_config_dir }}/paperless.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  register: paperless_env_changed

- name: Render protected PostgreSQL environment
  ansible.builtin.template:
    src: postgres.env.j2
    dest: "{{ paperless_config_dir }}/postgres.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  register: paperless_postgres_env_changed

- name: Render private Podman network and service Quadlets
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ paperless_quadlet_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - bergen-paperless.network
    - bergen-paperless-db.container
    - bergen-paperless-redis.container
    - bergen-paperless.container
  register: paperless_quadlets_changed

- name: Register Paperless Quadlet services without starting them
  ansible.builtin.systemd:
    daemon_reload: true

- name: Inspect staged service activation when start is not approved
  ansible.builtin.command:
    argv: [systemctl, is-active, --quiet, "{{ item }}"]
  loop:
    - bergen-paperless-db.service
    - bergen-paperless-redis.service
    - bergen-paperless.service
  register: paperless_staged_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: not (paperless_start_approved | bool)

- name: Refuse unintended Paperless service activation
  ansible.builtin.assert:
    that:
      - paperless_staged_status.results | selectattr('rc', 'equalto', 0) | list | length == 0
    fail_msg: >-
      One or more Paperless services were unexpectedly active despite
      paperless_start_approved=false. Inspect manually before proceeding.
  when: not (paperless_start_approved | bool)

- name: Start PostgreSQL and Redis only when separately approved
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - bergen-paperless-db.service
    - bergen-paperless-redis.service
  when: paperless_start_approved | bool

- name: Start Paperless only when separately approved
  ansible.builtin.systemd:
    name: bergen-paperless.service
    state: started
  when: paperless_start_approved | bool

- name: Explain the limited initial deployment boundary
  ansible.builtin.debug:
    msg:
      state: "{{ 'started' if paperless_start_approved | bool else 'installed_not_started' }}"
      backend_endpoint: "127.0.0.1:8000"
      access: localhost_only
      certificates: not_managed_here
      proxy_enrollment: disabled
      backup_required: true
