---
- name: Validate evaluation identity and pinned image
  ansible.builtin.assert:
    that:
      - mq_lab_confirm_test_only | bool
      - mq_lab_license_acceptance == 'accept'
      - ansible_facts.distribution == 'Rocky'
      - ansible_facts.distribution_major_version == '9'
      - ansible_facts.architecture == 'x86_64'
      - mq_lab_qmgr is match('^[A-Za-z0-9._%-]{1,48}$')
      - mq_lab_admin_password_var is match('^vault_[a-zA-Z0-9_]+$')
      - >-
        inventory_hostname == 'bergen-mq-lab' or
        (mq_lab_qmgr != 'BERGENLAB' and
         mq_lab_controller_ca_path == playbook_dir ~ '/../reports/mq/' ~ inventory_hostname ~ '-ca.crt' and
         mq_lab_controller_vars_path == playbook_dir ~ '/../vars/' ~ inventory_hostname ~ '.local.yml')
      - mq_lab_image is match('^icr[.]io/ibm-messaging/mq:9[.]4[.].*-amd64@sha256:[a-f0-9]{64}$')
      - ansible_host is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
      - inventory_hostname is match('^[A-Za-z0-9.-]+$')
      - mq_lab_controller_cidr is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+/[0-9]+$')
      - not mq_lab_allow_client_connections | bool or mq_lab_client_cidr is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+/[0-9]+$')
    fail_msg: "Evaluation only; use a pinned MQ 9.4 amd64 image, exact identity and authorized IPv4 source CIDRs."

- name: Validate MQ evaluation passwords
  ansible.builtin.assert:
    that:
      - mq_lab_admin_password | length >= 12
      - mq_lab_app_password | length >= 12
      - mq_lab_admin_password != mq_lab_app_password
      - mq_lab_admin_password == lookup('ansible.builtin.vars', mq_lab_admin_password_var)
      - "'\n' not in mq_lab_admin_password"
      - "'\n' not in mq_lab_app_password"
  no_log: true

- name: Require a list of additional admin networks
  ansible.builtin.assert:
    that:
      - mq_lab_admin_cidrs is sequence
      - mq_lab_admin_cidrs is not string
      - mq_lab_admin_cidrs is not mapping

- name: Validate additional admin IPv4 CIDR syntax
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+/[0-9]+$')
  loop: "{{ mq_lab_admin_cidrs }}"

- name: Validate address ranges with Python standard library
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import ipaddress,sys; [ipaddress.ip_network(v, strict=False) for v in sys.argv[1:]]"
      - "{{ mq_lab_controller_cidr }}"
      - "{{ mq_lab_client_cidr if mq_lab_allow_client_connections | bool else mq_lab_controller_cidr }}"
  changed_when: false

- name: Validate canonical admin networks and reject unrestricted access
  ansible.builtin.command:
    argv: "{{ ['/usr/bin/python3', '-c', 'import ipaddress,sys; nets=[ipaddress.IPv4Network(v, strict=True) for v in sys.argv[1:]]; sys.exit(1 if any(n.prefixlen == 0 for n in nets) else 0)'] + mq_lab_admin_cidrs }}"
  changed_when: false
