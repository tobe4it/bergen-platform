---
- name: Store Vault passwords in protected local secret inputs
  ansible.builtin.copy:
    dest: "/etc/bergen-mq-lab/secrets/{{ item.name }}"
    content: "{{ item.password }}"
    owner: root
    group: root
    mode: '0600'
  loop:
    - {name: mqAdminPassword, password: "{{ mq_lab_admin_password }}"}
    - {name: mqAppPassword, password: "{{ mq_lab_app_password }}"}
  register: mq_lab_secret_inputs
  no_log: true

- name: Inspect dedicated Podman secret metadata
  ansible.builtin.command:
    argv: [podman, secret, inspect, "{{ item }}"]
  environment:
    CONTAINERS_STORAGE_CONF: /etc/bergen-mq-lab/storage.conf
  loop: [mqAdminPassword, mqAppPassword]
  register: mq_lab_secret_metadata
  changed_when: false
  failed_when: >-
    mq_lab_secret_metadata.rc != 0 and
    not (mq_lab_secret_metadata.rc == 125 and
         'no such secret' in (mq_lab_secret_metadata.stderr | lower))
  no_log: true

- name: Create or replace changed secrets without command-line passwords
  ansible.builtin.command:
    argv: [podman, secret, create, --replace, "{{ item.item.name }}", "/etc/bergen-mq-lab/secrets/{{ item.item.name }}"]
  environment:
    CONTAINERS_STORAGE_CONF: /etc/bergen-mq-lab/storage.conf
  loop: "{{ mq_lab_secret_inputs.results }}"
  loop_control:
    index_var: mq_lab_secret_index
  when: item.changed or mq_lab_secret_metadata.results[mq_lab_secret_index].rc != 0
  register: mq_lab_secret_updates
  changed_when: true
  no_log: true
