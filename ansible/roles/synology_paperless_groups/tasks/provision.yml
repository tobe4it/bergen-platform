---
- name: Provision reviewed shared Paperless directories only under hardened root
  ansible.builtin.raw: |
    set -eu
    umask 077
    ROOT=/volume1/paperless-scan
    ACL=/usr/syno/bin/synoacltool
    NEW='group:Familie@bergen.intern:allow:r-x---a-R-c--:----'
    ADMIN='group:administrators:allow:rwxpdDaARWc--:fd--'
    LDAPADMIN='group:administrators@bergen.intern:allow:rwxpdDaARWc--:fd--'
    SERVICE='user:paperless-sync:allow:rwxpdDaARWc--:fd--'
    stage=

    fail() { echo "GROUP_PROVISION_FAIL: $*" >&2; exit 1; }
    cleanup() {
      if [ -n "$stage" ] && [ -d "$stage" ]; then
        rmdir "$stage" ||
          echo "GROUP_PROVISION_CLEANUP_FAILED: $stage" >&2
      fi
    }
    trap cleanup EXIT

    [ -d "$ROOT" ] && [ ! -L "$ROOT" ] || fail "invalid root"
    [ "$(stat -c '%u' "$ROOT")" = 0 ] || fail "root owner changed"
    rootacl=$("$ACL" -get "$ROOT")
    count=$(printf '%s\n' "$rootacl" |
      grep -cE '^[[:space:]]*\[[0-9]+\]' || true)
    [ "$count" -eq 4 ] || fail "unexpected root ACL count"
    for ace in "$ADMIN" "$LDAPADMIN" "$SERVICE" "$NEW"; do
      printf '%s\n' "$rootacl" |
        grep -Fq "$ace (level:0)" ||
        fail "root not in reviewed hardened state: $ace"
    done

    check_dir() {
      d=$1
      group=$2
      [ -d "$d" ] && [ ! -L "$d" ] || fail "unexpected $group path"
      [ "$(stat -c '%u' "$d")" = 0 ] || fail "$group owner not root"
      archived=$("$ACL" -get-archive "$d")
      case "$archived" in
        *is_inherit*) fail "$group unexpectedly inherits root ACL";;
        *has_ACL*) ;;
        *) fail "$group lacks direct ACL";;
      esac
      current=$("$ACL" -get "$d")
      n=$(printf '%s\n' "$current" |
        grep -cE '^[[:space:]]*\[[0-9]+\]' || true)
      [ "$n" -eq 3 ] || fail "$group unexpected ACL entry count"
      for ace in \
        "$ADMIN" "$SERVICE" \
        "group:$group@bergen.intern:allow:rwxpdDaARWc--:fd--"; do
        printf '%s\n' "$current" |
          grep -Fq "$ace (level:0)" ||
          fail "$group missing required ACE: $ace"
      done
    }

    for group in Eltern Familie; do
      dir="$ROOT/$group"
      if [ -e "$dir" ] || [ -L "$dir" ]; then
        check_dir "$dir" "$group"
        echo "GROUP_UNCHANGED: $group"
        continue
      fi

      stage="$ROOT/.bergen-group-stage-$group-$$"
      [ ! -e "$stage" ] && [ ! -L "$stage" ] ||
        fail "temporary name unexpectedly exists"
      mkdir -m 0700 "$stage"
      if "$ACL" -get-archive "$stage" | grep -q is_inherit; then
        "$ACL" -del-archive "$stage" is_inherit >/dev/null
      fi
      "$ACL" -add "$stage" "$ADMIN" >/dev/null
      "$ACL" -add "$stage" "$SERVICE" >/dev/null
      "$ACL" -add "$stage" \
        "group:$group@bergen.intern:allow:rwxpdDaARWc--:fd--" >/dev/null

      check_dir "$stage" "$group"
      [ ! -e "$dir" ] && [ ! -L "$dir" ] ||
        fail "$group was concurrently created"
      mv "$stage" "$dir"
      stage=
      check_dir "$dir" "$group"
      echo "GROUP_CREATED: $group"
    done

    echo GROUP_PROVISION_PASS
  register: synology_paperless_groups_provision
  changed_when: "'GROUP_CREATED:' in synology_paperless_groups_provision.stdout"

- name: Show shared-folder provisioning
  ansible.builtin.debug:
    var: synology_paperless_groups_provision.stdout_lines
